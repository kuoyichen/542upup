<style>
/* 版面：滿版 3D 舞台，介面元件浮在四角。單一暖色黏土世界，不做深色主題。 */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --glass:#86a8a6; --wood:#b48560; --teal:#3e7c8c;
  --paper:rgba(255,250,245,.78); --line:rgba(33,29,29,.10);
  --shadow:0 1px 2px #4a2a1410,0 6px 18px #4a2a1414,0 18px 48px #4a2a1412;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-num:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
.eyebrow{font:700 10px/1.2 var(--f-mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
.btn{min-height:44px;border-radius:9px;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--f-ui);cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"],.btn:active{background:var(--ink);color:var(--cream)}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;box-shadow:0 2px 8px #4a2a1414;padding:6px 12px;font-size:12px;border:0;color:var(--ink)}

/* island label pill */
.isl-label{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;background:rgba(255,248,244,.94);box-shadow:0 2px 8px #4a2a1420;font:600 13px/1 var(--f-ui);white-space:nowrap;transition:opacity .25s,background .2s,color .2s;user-select:none}
.isl-label b{font:700 10px/1 var(--f-mono);letter-spacing:1px;color:#fff;background:var(--coral);border-radius:999px;padding:4px 6px}
.isl-label.sel{background:var(--ink);color:var(--cream)}
.isl-label.dim{opacity:.45}

/* loading */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading .in{text-align:center;padding:0 24px}
#loading h1{margin:10px 0 6px;font-size:clamp(34px,7vw,64px);letter-spacing:4px;font-weight:900}
#loading p{margin:0;color:#6b5a50;font-size:15px}
#loading .err{margin-top:18px;color:#a3301a;font-size:14px;max-width:420px;line-height:1.6;white-space:pre-wrap}
.dots i{display:inline-block;width:8px;height:8px;margin:18px 4px 0;border-radius:50%;background:var(--coral);animation:bob 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--yellow)}.dots i:nth-child(3){animation-delay:.3s;background:var(--teal)}
@keyframes bob{50%{transform:translateY(-8px)}}

/* brand */
#brand{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
#brand .photo{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--stone)}
#brand h1{margin:2px 0 0;font-size:20px;font-weight:900;letter-spacing:1px}
#brand h1 span{color:var(--coral)}
#brand .sub{font-size:12px;color:#6b5a50;margin-top:2px}

/* tools */
#tools{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.btn .ic{font-size:16px;line-height:1}
.tool,#hud .hud-group .btn,#btnTime{flex-direction:column;gap:3px;font-size:11px;min-width:52px;padding:4px 8px}

/* sheets: card (left) and side (right) */
.sheet{position:fixed;z-index:12;background:rgba(255,250,245,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.grab{display:none}
#card{left:max(16px,env(safe-area-inset-left,0px));top:calc(176px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 176px - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:22px;box-shadow:0 1px 2px #4a2a1412,0 8px 24px #4a2a1418,0 28px 64px #4a2a1420}
#card .close{position:absolute;right:8px;top:8px;width:44px;z-index:2}
.card-body{overflow-y:auto;padding:22px 22px 24px;overscroll-behavior:contain}
.card-body h2{margin:6px 44px 4px 0;font-size:24px;line-height:1.25;font-weight:900;text-wrap:balance}
.card-body .lead{margin:8px 0 14px;font-size:14px;line-height:1.7;color:#4a3f3a}
.card-body .quote{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--cream);font-size:15px;line-height:1.75;border:1px solid var(--line)}
.card-body .quote small{display:block;margin-top:6px;font:700 10px/1.2 var(--f-mono);letter-spacing:2px;color:#8a7a70}
.card-body h3{margin:18px 0 8px;font:700 10px/1.2 var(--f-mono);letter-spacing:2px;color:#8a7a70;text-transform:uppercase}
.isl-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;color:var(--ink);box-shadow:inset 0 -3px 0 #0000001a}
.card-top{display:flex;gap:12px;align-items:center}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items button{width:100%;text-align:left;justify-content:flex-start;gap:10px;font-weight:500;line-height:1.35;padding:8px 10px;min-height:44px}
.num{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--coral);color:#fff;font:700 12px/1 var(--f-ui)}
.num.lit{background:var(--yellow);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.btnlike{cursor:pointer}
.chip.btnlike:hover{background:var(--yellow)}
.chip.cream{background:var(--cream)}
.thumb{width:160px;height:160px;border-radius:18px;background:var(--cream);display:block;margin:4px auto 6px;box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:12px 0}
.stat{padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 2px 8px #4a2a1414}
.stat b{display:block;font:italic 28px/1.05 var(--f-num);color:var(--coral)}
.stat span{font-size:12px;color:#6b5a50}
.when{display:flex;gap:6px;flex-wrap:wrap}
.when .chip{background:var(--yellow)}
.src{display:inline-block;margin-top:16px;font-size:12px;color:var(--teal)}
.lvl{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.lvl i{display:inline-block;width:34px;height:0;border-top:3px solid var(--coral)}
.lvl.thematic i{border-top-style:dashed}.lvl.pending i{border-top-style:dotted}
.flowline{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:700}
.flowline .arrow{color:var(--coral);font-size:20px}

#side{right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));width:318px;border-radius:22px;background:rgba(255,250,245,.72)}
.side-head{padding:14px 14px 8px;display:grid;gap:10px}
#search{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font:14px var(--f-ui);color:var(--ink)}
#search:focus-visible{outline:3px solid var(--coral);outline-offset:1px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:3px;border-radius:12px;background:#4a2a140d}
.tab{min-height:40px;border-radius:9px;border:0;background:transparent;font:600 13px var(--f-ui);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:#fff;box-shadow:0 2px 8px #4a2a1414}
.tab:focus-visible{outline:3px solid var(--coral)}
.side-body{overflow-y:auto;padding:4px 10px 16px;overscroll-behavior:contain}
.pillar-h{margin:14px 6px 6px}
.pillar-h .eyebrow{display:block}
.pillar-h small{font-size:12px;color:#6b5a50}
details.isl{border-radius:14px;margin:4px 0}
details.isl[open]{background:#fff;box-shadow:0 2px 8px #4a2a1414}
details.isl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:12px;font-weight:700}
details.isl summary::-webkit-details-marker{display:none}
details.isl summary:hover{background:var(--yellow)}
details.isl summary:focus-visible{outline:3px solid var(--coral)}
details.isl summary .no{font:700 10px/1 var(--f-mono);letter-spacing:1px;color:#fff;background:var(--coral);border-radius:999px;padding:4px 6px}
details.isl summary .cnt{margin-left:auto;font-size:12px;color:#8a7a70;font-weight:500}
details.isl .items{padding:0 6px 8px}
.flowrow{width:100%;text-align:left;justify-content:flex-start;flex-wrap:wrap;gap:4px 10px;padding:10px;min-height:56px;font-weight:500}
.flowrow b{font-weight:700}
.empty{padding:20px 10px;color:#8a7a70;font-size:13px}
mark{background:var(--yellow);color:inherit;border-radius:3px}

/* HUD */
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#hud .btn{border-radius:999px}
#btnTime{display:none}
.hud-group{display:flex;gap:2px}
.hud-time{display:flex;flex-direction:column;align-items:center;padding:0 10px 0 14px;min-width:84px}
.hud-time .time{font:italic 22px/1 var(--f-num)}
.hud-time .slot{font-size:10px;color:#8a7a70;margin-top:3px;white-space:nowrap}
.hud-sep{width:1px;height:30px;background:var(--line);margin:0 4px}

/* log */
#log{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:11;width:300px;max-height:40vh;display:flex;flex-direction:column;border-radius:18px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow:hidden}
body.side-open #log{right:calc(318px + 32px + env(safe-area-inset-right,0px))}
.log-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--f-mono);letter-spacing:2px;color:#2e8b57}
.live i{width:8px;height:8px;border-radius:50%;background:#34c46a;box-shadow:0 0 0 3px #34c46a33;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #34c46a00}}
#logFilter{margin-left:auto;min-height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font:12px var(--f-ui);max-width:120px}
#logList{list-style:none;margin:0;padding:6px 8px;overflow-y:auto;font-size:12px;line-height:1.5}
#logList li{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:5px 4px;border-bottom:1px dashed var(--line)}
#logList time{font:italic 13px var(--f-num);color:#8a7a70}
#logList .k{font:700 9px var(--f-mono);letter-spacing:1px;color:var(--coral);margin-right:4px}

#legend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:14px;padding:8px 14px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:12px;white-space:nowrap}

/* help */
#help{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#211d1d55;padding:16px}
.help-in{width:min(440px,100%);border-radius:22px;background:var(--cream);padding:26px;box-shadow:0 30px 80px #211d1d55}
.help-in h2{margin:6px 0 14px;font-size:26px;font-weight:900}
.help-in ol{margin:0 0 20px;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.help-in li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:2px 10px;font-size:14px;line-height:1.55}
.help-in li::before{content:counter(s);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:italic 700 16px var(--f-num)}
.help-in li span{color:#6b5a50}
.btn.primary{background:var(--ink);color:var(--cream);width:100%;font-size:15px}
.btn.primary:hover{background:var(--coral)}
.help-acts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.foot-btn{border:1.5px solid var(--ink);border-radius:9px;font-size:14px;padding:0 16px}
.foot-btn:hover{background:#211d1d0d}
#foot h2{margin:6px 0 14px;font-size:26px;font-weight:900}
.foot-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.foot-tile{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px #4a2a1410}
.foot-tile small{display:block;font-size:12px;color:#6b5a50}
.foot-tile b{display:block;font:italic 700 28px/1.2 var(--f-num);color:var(--ink);margin-top:2px}
.foot-tile b span{font:600 13px var(--f-ui);font-style:normal;color:#6b5a50;margin-left:3px}
.foot-tile.hero b{color:var(--coral)}
.foot-chart{margin:0 0 6px}
.foot-chart .cap{display:flex;justify-content:space-between;font-size:12px;color:#6b5a50;margin-bottom:6px}
.foot-bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:86px}
.foot-bars i{display:block;background:var(--coral);border-radius:4px 4px 0 0;min-height:2px}
.foot-bars i.today{background:var(--ink)}
.foot-axis{display:flex;justify-content:space-between;font:11px var(--f-mono);color:#8a7a70;margin:4px 0 14px}
.foot-msg{font-size:14px;line-height:1.6;color:#6b5a50;background:#fff;border-radius:14px;padding:14px;margin-bottom:16px}
#footBack{width:100%}
/* 導覽字幕 */
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;width:min(620px,calc(100% - 32px));background:var(--cream);border-radius:18px;padding:12px 16px 14px;box-shadow:0 18px 50px #211d1d40}
.cap-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cap-btns{display:flex;gap:2px}
.cap-btns .btn{min-height:36px;min-width:36px;padding:0 8px;font-size:14px}
#capTitle{margin:2px 0 4px;font-size:19px;font-weight:900}
#capText{margin:0;font-size:14.5px;line-height:1.65;color:#4b3f38}
.cap-bar{height:4px;border-radius:4px;background:#211d1d14;margin-top:10px;overflow:hidden}
.cap-bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .6s}
/* 通用視窗、提示 */
#modal{position:fixed;inset:0;z-index:41;display:grid;place-items:center;background:#211d1d55;padding:16px}
#modal .help-in{position:relative}
#modal h2{margin:6px 0 10px;font-size:24px;font-weight:900}
.modal-p{font-size:14px;line-height:1.65;color:#6b5a50;margin:0 0 16px}
.modal-p.small{font-size:12.5px;margin:6px 0 14px}
.modal-acts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.modal-x{position:absolute;top:10px;right:10px;min-height:40px;min-width:40px}
.bottle-note{background:#fffdf2;border-radius:14px;padding:14px 16px;margin:10px 0 16px;font-size:16px;line-height:1.75;box-shadow:inset 0 0 0 1px #e9dcb8;white-space:pre-wrap;word-break:break-word}
.bottle-note .by{text-align:right;font-size:13px;color:#8a7a70;margin-top:8px}
#modal textarea,#modal input{width:100%;box-sizing:border-box;border:1.5px solid #d9cabd;border-radius:12px;padding:10px 12px;font:15px/1.6 var(--f-ui);background:#fff;color:var(--ink);margin-bottom:8px;resize:vertical}
#modal textarea:focus,#modal input:focus{outline:3px solid var(--coral);outline-offset:1px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(18px + env(safe-area-inset-top,0px));z-index:45;background:var(--ink);color:var(--cream);border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 10px 30px #211d1d40;max-width:calc(100% - 32px);text-align:center}
/* 第一人稱漫步 */
#walk{position:fixed;inset:0;z-index:12;pointer-events:none}
#walkHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:#211d1dcc;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.6;max-width:min(560px,calc(100% - 32px));text-align:center}
#walkStick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:#fff8f455;border:2px solid #fff8f4aa;pointer-events:auto;touch-action:none;display:none}
#walkStick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--cream);box-shadow:0 4px 12px #211d1d40}
@media (pointer:coarse){#walkStick{display:block}}
#walkBtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
#walkBtns .btn{background:var(--cream);box-shadow:var(--shadow);border-radius:999px;padding:0 18px;font-size:14px}
#walkBoard{background:var(--coral)!important;color:#fff!important}
#pathCard{left:max(16px,env(safe-area-inset-left,0px));top:calc(176px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 176px - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:22px;z-index:11}
#pathCard .close{position:absolute;right:8px;top:8px;width:44px;z-index:2}
#pathBody{overflow:auto}
#card{z-index:13}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip.pick{cursor:pointer;min-height:36px;font-size:13px;box-shadow:0 0 0 1.5px #d9cabd inset}
.chip.pick:hover{background:var(--cream)}
.chip.pick.on{background:var(--yellow);box-shadow:0 0 0 2px var(--ink) inset;font-weight:700}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.prog{height:10px;border-radius:6px;background:#efe2d6;overflow:hidden;margin:6px 0 12px}
.prog>i{display:block;height:100%;background:var(--coral);border-radius:6px}
.hints{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.7;color:#5b4b44}
.help-in .hints li{display:list-item;font-size:13px;line-height:1.7}
.help-in .hints li::before{content:none}
#wxBanner small{margin-left:8px;opacity:.85}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:6px 0 12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px;border-radius:14px;background:#f3eae2;font-size:11px;color:#9a8a80;filter:grayscale(1);opacity:.7}
.badge b{font-size:24px;line-height:1.1}
.badge small{font-size:10px;line-height:1.35;color:inherit;opacity:.8}
.badge.got{background:#fff;color:var(--ink);filter:none;opacity:1;box-shadow:0 2px 8px #4a2a1418}
.q{font-size:17px;font-weight:700;line-height:1.5;margin:6px 0 10px}
.qopts{display:grid;gap:8px;margin-bottom:8px}
.qopt{justify-content:flex-start;text-align:left;min-height:44px;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1.5px #d9cabd inset;font-size:14px;line-height:1.4}
.qopt:hover{background:var(--cream)}
.qopt.right{background:#d8f0d2;box-shadow:0 0 0 2px #3b8a3a inset}
.qopt.wrong{background:#fbd9d2;box-shadow:0 0 0 2px var(--coral) inset}
.path-note{font-size:13px;line-height:1.6;color:#5b4b44;margin:4px 0 12px}
.path-note.small{font-size:12px;color:#8a7a70}
.path-step{display:flex;gap:10px;margin:0 0 14px}
.path-step .dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 2px var(--ink) inset}
.path-step>div{min-width:0;flex:1}
.path-step ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.path-step .link{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:6px 8px;color:var(--ink);cursor:pointer;font:inherit}
.path-step .link:hover{background:#fff}
.path-step .link b{display:block;font-size:14px}
.path-step .link span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.5;color:#6b5b54}
.path-pin{width:30px;height:30px;border-radius:50%;border:0;background:var(--yellow);color:var(--ink);font:900 14px var(--f-ui);box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 10px #211d1d40;cursor:pointer;pointer-events:auto}
#wxBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:#3a4656;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;box-shadow:0 8px 24px #211d1d40;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
body.walking #pathCard,body.walking .path-pin{display:none!important}
body.walking .isl-label,body.walking #tools,body.walking #side,body.walking #card,body.walking #legend{display:none!important}

/* pins */
.pin{width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--f-ui);box-shadow:0 2px 6px #4a2a1440;pointer-events:auto;cursor:pointer;border:2px solid #fff}
.pin.lit{background:var(--yellow);color:var(--ink)}
.pin.sel{background:var(--ink)}
.isl-label.short .nm{display:none}
.isl-label.hide{visibility:hidden}
.bubble{padding:4px 9px;border-radius:999px;background:#fff;box-shadow:0 2px 8px #4a2a1426;font:600 11px/1.2 var(--f-ui);white-space:nowrap;transform:translateY(-6px);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:#fff;border-bottom:0}

/* 手機版 ≤800px */
@media (max-width:800px){
  #brand{padding:8px 12px;gap:8px;border-radius:14px;max-width:calc(100% - 128px)}
  #brand .photo{width:34px;height:34px}
  #brand h1{font-size:15px;line-height:1.25}
  .tool{min-width:52px;font-size:10px}
  #brand .sub{display:none}
  #tools{left:auto;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));flex-direction:column}
  .sheet{left:0!important;right:0!important;bottom:0!important;top:auto!important;width:auto!important;max-height:none!important;border-radius:22px 22px 0 0!important;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s ease}
  .sheet.dragging{transition:none}
  #card{height:34%;z-index:14}
  #pathCard{height:45%;z-index:13}
  #wxBanner{bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
  #side{height:52%;z-index:13}
  .grab{display:block;flex:none;height:28px;cursor:grab;touch-action:none;position:relative}
  .grab::before{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#211d1d33}
  .card-body{padding:4px max(18px,env(safe-area-inset-left,0px)) 24px max(18px,env(safe-area-inset-right,0px))}
  #card .close{top:2px}
  .card-body h2{font-size:21px}
  .thumb{width:120px;height:120px}
  #hud{gap:0;padding:4px}
  #btnTime{display:inline-flex}
  .hud-time,#timeBtns,.hud-sep{display:none}
  #hud.time-open .hud-time,#hud.time-open #timeBtns{display:flex}
  #hud.time-open .hud-time{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 64px);padding:6px 14px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow)}
  #hud.time-open #timeBtns{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);padding:4px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow)}
  #hud .hud-group .btn,#btnTime{min-width:44px;padding:4px 5px;font-size:10px}
  #log{left:max(16px,env(safe-area-inset-left,0px));right:calc(84px + env(safe-area-inset-right,0px));width:auto;top:calc(72px + env(safe-area-inset-top,0px));max-height:30vh}
  body.side-open #log{right:calc(84px + env(safe-area-inset-right,0px))}
  #legend{bottom:calc(76px + env(safe-area-inset-bottom,0px));gap:10px;font-size:11px;padding:6px 12px}
  .isl-label{font-size:12px;padding:4px 9px 4px 5px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.cand-label{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--coral);color:#fff;font:800 12px/1 var(--f-ui);letter-spacing:1px;box-shadow:0 3px 10px #4a2a1440;white-space:nowrap;pointer-events:auto;cursor:pointer;border:2px solid #fff}
.cand-label i{font-style:normal;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--coral);display:grid;place-items:center;font-size:10px}
.cand-act{display:block;margin-top:4px;padding:3px 8px;border-radius:999px;background:#fff;color:var(--ink);font:600 10px/1.2 var(--f-ui);letter-spacing:0;box-shadow:0 2px 6px #4a2a1420;text-align:center}
.cand-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--stone)}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.vids button{width:100%;text-align:left;justify-content:flex-start;gap:10px;font-weight:500;line-height:1.35;padding:8px 10px;min-height:44px}
.play{flex:none;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:#fff;font-size:10px;padding-left:2px}
.vid-group{margin:14px 6px 6px}
.isl-label .vid{font-style:normal;font-size:9px;color:var(--coral);margin-left:-2px}
.isl-label.sel .vid{color:var(--yellow)}
#player{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:#211d1dcc;padding:16px}
.player-in{width:min(860px,100%);border-radius:22px;background:var(--cream);padding:16px;box-shadow:0 30px 80px #0008}
.player-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.player-head h2{margin:4px 0 0;font-size:20px;line-height:1.3;text-wrap:balance}
#playerVideo{width:100%;max-height:70vh;border-radius:14px;background:#000;display:block}
.player-note{margin:10px 2px 0;font-size:13px;color:#6b5a50}
</style>
</head>

<script type="importmap">
{ "imports": {

<div id="stage"></div>
<div id="labels"></div>

<header id="brand">
  <img class="photo" id="brandPhoto" alt="" hidden>
  <div>
    <div class="eyebrow" id="brandEyebrow"></div>
    <h1 id="brandTitle"></h1>
    <div class="sub" id="brandSub"></div>
  </div>
</header>

<nav id="tools" aria-label="檢視">
  <button class="btn tool" id="btnOverview" title="全景"><span class="ic">⌂</span><span data-en="Overview">全景</span></button>
  <button class="btn tool" id="btnList" aria-pressed="false" aria-controls="side"><span class="ic">☰</span><span data-en="List">清單</span></button>
  <button class="btn tool" id="btnTour" title="導覽"><span class="ic">🧭</span><span data-en="Tour">導覽</span></button>
  <button class="btn tool" id="btnWalk" aria-pressed="false" title="第一人稱漫步"><span class="ic">🚶</span><span data-en="Walk">漫步</span></button>
  <button class="btn tool" id="btnBottle" title="留言瓶"><span class="ic">🍾</span><span data-en="Bottles">留言瓶</span></button>
  <button class="btn tool" id="btnPath" title="我的路：找到你關心的政見"><span class="ic">🗺</span><span data-en="My path">我的路</span></button>
  <button class="btn tool" id="btnQuest" title="小任務與徽章"><span class="ic">🏅</span><span data-en="Quests">任務</span></button>
  <button class="btn tool" id="btnWeather" title="四季與天氣"><span class="ic">🌤</span><span data-en="Weather">天氣</span></button>
  <button class="btn tool" id="btnHelp" aria-label="說明"><span class="ic">?</span><span data-en="Help">說明</span></button>
</nav>

<div id="caption" hidden role="region" aria-label="導覽" aria-live="polite">
  <div class="cap-top"><span class="eyebrow" id="capStep"></span><span class="cap-btns"><button class="btn" id="capPrev" aria-label="上一站">◀</button><button class="btn" id="capPlay" aria-label="暫停／繼續">⏸</button><button class="btn" id="capNext" aria-label="下一站">▶</button><button class="btn" id="capVoice" aria-label="語音">🔊</button><button class="btn" id="capClose" aria-label="結束導覽">✕</button></span></div>
  <h3 id="capTitle"></h3>
  <p id="capText"></p>
  <div class="cap-bar"><i id="capProg"></i></div>
</div>

<div id="walk" hidden>
  <div id="walkHint" hidden></div>
  <div id="walkStick" aria-hidden="true"><i></i></div>
  <div id="walkBtns"><button class="btn" id="walkBoard" hidden>⛵ <span>搭草鞋船</span></button><button class="btn" id="walkExit">✕ <span data-en="Exit walk">離開漫步</span></button></div>
</div>

<div id="modal" hidden role="dialog" aria-modal="true"><div class="help-in" id="modalBody"></div></div>

</section>

<div id="legend" hidden></div>

<script type="module">
// ───────────────────────── 基本工具 ─────────────────────────
const $ = (s) => document.querySelector(s);
const LANG = (() => { try { return new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } })();
const tr = (zh, en) => (LANG === 'en' && en ? en : zh);
const store = {
  get(k, d) { try { const v = localStorage.getItem('542upup:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('542upup:' + k, JSON.stringify(v)); } catch (e) { /* 私密模式 */ } }
};
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(5422026);
const rr = (a, b) => a + (b - a) * rand();

function fail(err) {
  console.error(err);
  $('#loadingDots').hidden = true;
  $('#loadingMsg').textContent = tr('城市組合失敗', 'Could not build the city');
  const box = $('#loadingErr');
  box.hidden = false;
  box.textContent = tr('可能是瀏覽器不支援 WebGL，或網路無法載入 Three.js。請重新整理，或改用最新版 Chrome／Safari。', 'Your browser may not support WebGL, or Three.js could not be downloaded. Reload, or try a recent Chrome or Safari.') + '\n\n' + (err && err.message ? err.message : String(err));
  $('#loading').classList.remove('done');
}

// ───────────────────────── 常數 ─────────────────────────
const R = 2.02, SPACING = 2.28, TOP = 0.65, WATER_Y = -0.18;
const SQ3 = Math.sqrt(3);
const PATH_R = 1.8;
const C = {
  coral: '#db6a41', ink: '#211d1d', cream: '#fff8f4', yellow: '#fcea8b', stone: '#c5b5a7', green: '#71806a',
  glass: '#86a8a6', wood: '#b48560', teal: '#3e7c8c', plant: ['#9cc27a', '#8db86f', '#728f5f'],
  pastel: ['#f2b5c6', '#58a6a6', '#6f7fb5'], curb: '#e4d6c3', path: '#e8cdb0', glow: '#ffc777'
};
const isMobile = matchMedia('(max-width: 800px)').matches;
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');

// ───────────────────────── 品牌卡 ─────────────────────────
(function brand() {
  const c = DATA.city;
  $('#brandEyebrow').textContent = tr(c.role, c.roleEn);
  $('#brandTitle').innerHTML = `${tr(c.candidate, c.candidateEn)} <span>${tr('政策島', 'Policy Islands')}</span>`;
  $('#brandSub').textContent = tr(c.slogan, c.sloganEn);
  const img = $('#brandPhoto');
  img.onload = () => { img.hidden = false; };
  img.onerror = () => { img.remove(); };
  img.src = c.images.hero;
  if (LANG === 'en') {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach((el) => { el.textContent = el.dataset.en; });
    const aria = { '#tools': 'View', '#cardClose': 'Close card', '#side': 'Policy list', '#search': 'Search policies', '#log': 'City log', '#logFilter': 'Filter by link', '#hud': 'Time and display', '#btnHelp': 'Help', '#hud > #btnTime': 'Time' };
    Object.entries(aria).forEach(([q, v]) => { const el = $(q); if (el) el.setAttribute('aria-label', v); });
    $('#loadingMsg').textContent = 'Assembling the policy city…';
    $('#loading h1').textContent = 'Caotun Policy Islands';
  }
  document.title = tr(c.title, c.titleEn);
})();

let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, BufferGeometryUtils, SimplexNoise;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js'));
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  BufferGeometryUtils = await import('three/addons/utils/BufferGeometryUtils.js');
  ({ SimplexNoise } = await import('three/addons/math/SimplexNoise.js'));
  init();
} catch (err) {
  fail(err);
}

function init() {
  let dirty = true;
  const onFrame = [];
  const afterRender = [];
  // ───────────────────────── Renderer ─────────────────────────
  const stageEl = $('#stage');
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('WebGL unavailable');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.4 : 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  stageEl.appendChild(renderer.domElement);
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('aria-label', tr('草屯鎮政策島 3D 城市', 'Caotun policy islands 3D city'));

  const labelRenderer = new CSS2DRenderer({ element: $('#labels') });

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.3, 320);

  // ───────────────────────── 島嶼座標 ─────────────────────────
  const axial = (q, r) => new THREE.Vector3(SQ3 * SPACING * (q + r / 2), 0, 1.5 * SPACING * r);
  const islands = DATA.islands.map((d, i) => ({ d, i, c: axial(d.q, d.r) }));
  const byId = Object.fromEntries(islands.map((s) => [s.d.id, s]));
  const center = new THREE.Vector3();
  islands.forEach((s) => center.add(s.c));
  center.divideScalar(islands.length);
  center.y = TOP;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  // 平移：一指（滑鼠左鍵）拖曳平移；兩指（滑鼠右鍵）旋轉，兩指捏合縮放。沿地面平移，焦點限制在城市範圍內
  controls.enablePan = true;
  controls.screenSpacePanning = false;
  controls.panSpeed = 0.9;
  controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
  controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = 3;
  controls.maxDistance = 70;

  const OVERVIEW_DIR = new THREE.Vector3(0.24, 0.33, 0.87).normalize();
  // 直式螢幕：把方位轉到城市最窄的那一面，讓 12 座島都能入鏡
  const PORTRAIT = (() => {
    const base = Math.atan2(OVERVIEW_DIR.x, OVERVIEW_DIR.z), hor = Math.hypot(OVERVIEW_DIR.x, OVERVIEW_DIR.z);
    let best = null;
    for (let deg = -80; deg <= 80; deg += 4) {
      const a = base + THREE.MathUtils.degToRad(deg);
      const hx = Math.sin(a), hz = Math.cos(a);
      let lo = 1e9, hi = -1e9;
      islands.forEach((s) => { const p = (s.c.x - center.x) * hz - (s.c.z - center.z) * hx; lo = Math.min(lo, p); hi = Math.max(hi, p); });
      const w = hi - lo + 2 * R + Math.abs(deg) * .02;
      if (!best || w < best.score) best = { score: w, w: hi - lo + 2 * R, mid: (hi + lo) / 2, hx, hz, dir: new THREE.Vector3(hx * hor, OVERVIEW_DIR.y, hz * hor).normalize() };
    }
    return best;
  })();
  const overviewDir = () => (innerWidth / innerHeight < .8 ? PORTRAIT.dir : OVERVIEW_DIR);
  function overviewDistance() {
    const a = innerWidth / innerHeight;
    if (a > 1.25) return 28.5;
    if (a > 0.8) return 38;
    const need = (PORTRAIT.w / 2 + 2.4) / (Math.tan(THREE.MathUtils.degToRad(16)) * a);
    return THREE.MathUtils.clamp(need, 40, 68);
  }
  function overviewTarget() {
    const t = center.clone();
    if (innerWidth / innerHeight < .8) { t.x += PORTRAIT.hz * PORTRAIT.mid; t.z -= PORTRAIT.hx * PORTRAIT.mid; }
    if (innerWidth > 800 && document.body.classList.contains('side-open')) {
      const d = overviewDir();
      t.x += d.z * 2.4; t.z += -d.x * 2.4;
    }
    return t;
  }
  function overview() {
    controls.target.copy(overviewTarget());
    camera.position.copy(controls.target).addScaledVector(overviewDir(), overviewDistance());
    controls.update();
    dirty = true;
  }

  // ───────────────────────── 天空 ─────────────────────────
  const skyU = {
    uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSun: { value: new THREE.Color() }, uNight: { value: 0 }
  };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(170, 48, 24), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uTop,uHorizon,uSun,uSunDir; uniform float uNight; varying vec3 vDir;
      float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
      void main(){
        vec3 d = normalize(vDir);
        vec3 c = mix(uHorizon, uTop, smoothstep(-.02,.55,d.y));
        float s = max(dot(d, normalize(uSunDir)), 0.);
        c += uSun * pow(s, 18.) * .35;
        if (uNight > .01) {
          float n = h3(floor(d * 180.));
          if (n > .9965) c += vec3(.95,.95,1.) * uNight * smoothstep(.02,.25,d.y) * (.4 + (n-.9965)/.0035*.6);
        }
        gl_FragColor = vec4(c, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  scene.add(sky);

  // ───────────────────────── 光 ─────────────────────────
  const hemi = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.3);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1de, 2.8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 22, bottom: -22, near: 1, far: 90 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.045;
  sun.shadow.radius = 3;
  sun.target.position.copy(center);
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.copy(center).add(new THREE.Vector3(-20, 12, -14));
  fill.target.position.copy(center);
  scene.add(fill, fill.target);

  // ───────────────────────── 水 ─────────────────────────
  const waterU = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uShallow: { value: new THREE.Color('#a4d4da') }, uDeep: { value: new THREE.Color('#6fa9b8') },
    uTime: { value: 0 }, uCenter: { value: new THREE.Vector2(center.x, center.z) }, uNight: { value: 0 }
  }]);
  const waterVS = `#include <fog_pars_vertex>
    varying vec3 vW;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`;
  const waterFS = (wall) => `#include <fog_pars_fragment>
    uniform vec3 uShallow,uDeep; uniform float uTime,uNight; uniform vec2 uCenter; varying vec3 vW;
    void main(){
      float d = length(vW.xz - uCenter);
      float w = sin(vW.x*.33 + uTime*.35) * sin(vW.z*.29 - uTime*.28) * .5 + sin((vW.x - vW.z)*.8 + uTime*.6) * .25;
      ${wall
        ? `float k = clamp((${TOP.toFixed(2)} - vW.y) / 1.1, 0., 1.);
           vec3 c = mix(uShallow * .96, uDeep * .78, .25 + k * .75) + w * .015;`
        : `float t = smoothstep(9., 70., d);
           vec3 c = mix(uShallow, uDeep, clamp(t + w * .07, 0., 1.)) + w * .02;
           float sp = sin(vW.x*5.3 + uTime*1.2) * sin(vW.z*4.9 - uTime*1.05) * sin((vW.x+vW.z)*2.1 + uTime*.7);
           c += smoothstep(.93, 1., sp) * (1. - t) * .12 * (1. - uNight * .6);`}
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`;
  const waterMat = new THREE.ShaderMaterial({ uniforms: waterU, vertexShader: waterVS, fragmentShader: waterFS(false), fog: true });
  const water = new THREE.Mesh(new THREE.CircleGeometry(160, 64).rotateX(-Math.PI / 2), waterMat);
  water.position.set(center.x, WATER_Y, center.z);
  water.receiveShadow = false;
  scene.add(water);
  const wallMat = new THREE.ShaderMaterial({ uniforms: waterU, vertexShader: waterVS, fragmentShader: waterFS(true), fog: true });

      for (let y = 0; y < s; y += bh) {
        const off = (y / bh) % 2 ? bw / 2 : 0;
        for (let x = -bw; x < s + bw; x += bw) {
          const v = 236 + texRand() * 14 | 0;

      g.fillStyle = '#f7f6ef'; g.fillRect(0, 0, s, s);

    });

  // ───────────────────────── 六角形幾何 ─────────────────────────

  const hexV = (r, k) => { const a = Math.PI / 6 + k * Math.PI / 3; return [r * Math.cos(a), r * Math.sin(a)]; };
  function hexRing(rIn, rOut) {
    const pos = [], idx = [];

    for (let k = 0; k < 6; k++) {

  // ───────────────────────── 島 ─────────────────────────

      if (islands.some((s) => Math.hypot(s.c.x - x, s.c.z - z) < R + .8)) continue;

      if (docks.some((dk) => Math.hypot(dk.end.x - x, dk.end.z - z) < 1.4)) continue;

      const m = new THREE.Mesh(sandalGeo, sandalMat); m.castShadow = true; m.scale.setScalar(1.5); g.add(m);
      const hit = new THREE.Mesh(sandalHit, hitMat); g.add(hit);
      g.position.set(s.c.x + x, TOP, s.c.z + z); g.rotation.y = Math.atan2(-x, -z) + .6;
      const t = { id: 'sd' + i, s, g, hit, found: found.includes('sd' + i), jump: 0 };
      hit.userData.sandal = t;
      g.visible = !t.found; scene.add(g); SANDALS.push(t);
    });
  }
  function findSandal(t) {
    if (t.found) return;
    t.found = true; t.jump = .001;
    const list = store.get('sandals', []); list.push(t.id); store.set('sandals', list);
    const n = SANDALS.filter((x) => x.found).length;
    toast(tr(`👡 找到小草鞋！（${n} / ${SANDALS.length}）`, `👡 Sandal found! (${n} / ${SANDALS.length})`), 3000);
    youLog('you', tr(`在${t.s.d.name}找到第 ${n} 隻小草鞋`, `Sandal ${n} found on ${t.s.d.en}`));
    award('first'); if (n >= SANDALS.length) setTimeout(() => award('sandal10'), 1800);
  }
  onFrame.push((dt, animate) => {
    for (const t of SANDALS) {
      if (!t.g.visible) continue;
      if (WALK.on && !t.found && Math.hypot(t.g.position.x - WALK.pos.x, t.g.position.z - WALK.pos.z) < .45) findSandal(t);
      if (!animate) continue;
      if (t.jump > 0) {
        t.jump += dt; const u = t.jump / 1.2;
        t.g.position.y = TOP + Math.sin(Math.min(1, u) * Math.PI) * .6; t.g.rotation.y += dt * 12; t.g.scale.setScalar(Math.max(.01, 1 - Math.max(0, u - .6) * 2.5));
        if (u >= 1) t.g.visible = false;
      } else t.g.position.y = TOP + Math.abs(Math.sin(elapsed * 2.2 + t.id.length * 1.7)) * .02;
    }
  });
  pickers.unshift((ray) => {
    const live = SANDALS.filter((t) => t.g.visible && !t.found);
    if (!live.length) return false;
    const hit = ray.intersectObjects(live.map((t) => t.hit), false)[0];
    if (!hit) return false;
    findSandal(hit.object.userData.sandal);
    return true;
  });
  // 政見問答：題目全部從 DATA 自動出題
  const pillarOf = (s) => DATA.pillars.find((p) => p.id === s.d.pillar);
  const allItems = islands.flatMap((s) => s.d.items.map((it) => ({ it, s })));
  function quizQuestions() {
    const gens = [
      () => { const s = pickOne(islands), pol = pickOne(s.d.policies), right = pillarOf(s); const others = sample(DATA.pillars.filter((p) => p !== right), 3);
        return { q: tr(`「${pol}」屬於哪一項升級？`, `Which upgrade includes “${pol}”?`), a: shuffle([right, ...others].map((p) => [tr(p.name, p.en), p === right])) }; },
      () => { const x = pickOne(allItems), others = sample(islands.filter((s) => s !== x.s), 3);
        return { q: tr(`「${x.it.name}」在哪一座政策島？`, `Which island has “${x.it.en}”?`), a: shuffle([x.s, ...others].map((s) => [tr(s.d.name, s.d.en), s === x.s])) }; },
      () => { const s = pickOne(islands), right = pickOne(s.d.items), others = sample(allItems.filter((x) => x.s !== s), 3).map((x) => x.it);
        return { q: tr(`哪一項是「${s.d.name}」島上的政見？`, `Which policy is on ${s.d.en}?`), a: shuffle([[tr(right.name, right.en), true], ...others.map((it) => [tr(it.name, it.en), false])]) }; },
      () => { const p = pickOne(DATA.pillars), mine = islands.filter((s) => s.d.pillar === p.id), right = pickOne(mine), others = sample(islands.filter((s) => s.d.pillar !== p.id), 3);
        return { q: tr(`哪一座島屬於「${p.name}」？`, `Which island belongs to “${p.en}”?`), a: shuffle([right, ...others].map((s) => [tr(s.d.name, s.d.en), s === right])) }; }
    ];
    const out = [];
    for (let k = 0; out.length < 5 && k < 20; k++) out.push(gens[k % gens.length]());
    return shuffle(out);
  }
  function startQuiz() {
    const qs = quizQuestions(); let i = 0, score = 0;
    const show = () => {
      if (i >= qs.length) {
        if (score >= 3) award('quiz'); if (score === qs.length) award('quizfull');
        openModal(`<div class="eyebrow">🎓 ${tr('政見問答', 'Policy quiz')}</div><h2>${tr(`答對 ${score} / ${qs.length} 題`, `${score} / ${qs.length} correct`)}</h2>
          <p class="modal-p">${score === qs.length ? tr('全部答對，你已經是政見通了！', 'Perfect! You know the platform inside out.') : score >= 3 ? tr('很厲害！再挑戰一次拿滿分吧。', 'Nice! Try again for a perfect score.') : tr('點島上的建物看看政見原文，再來挑戰！', 'Tap the buildings to read the policies, then try again!')}</p>
          <div class="modal-acts"><button class="btn foot-btn" id="qBack">${tr('回小任務', 'Back')}</button><button class="btn primary" id="qAgain">${tr('再玩一次', 'Play again')}</button></div>`);
        $('#qAgain').addEventListener('click', startQuiz); $('#qBack').addEventListener('click', openQuests);
        return;
      }
      const q = qs[i];
      openModal(`<div class="eyebrow">🎓 ${tr('政見問答', 'Policy quiz')} ${i + 1} / ${qs.length}</div><h2 class="q">${esc(q.q)}</h2>
        <div class="qopts">${q.a.map(([t], k) => `<button class="btn qopt" data-k="${k}">${esc(t)}</button>`).join('')}</div>
        <button class="btn modal-x" data-close aria-label="${tr('關閉', 'Close')}">✕</button>`);
      modalBody.querySelectorAll('.qopt').forEach((b) => b.addEventListener('click', () => {
        const ok = q.a[+b.dataset.k][1]; if (ok) score++;
        modalBody.querySelectorAll('.qopt').forEach((x) => { x.disabled = true; if (q.a[+x.dataset.k][1]) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        setTimeout(() => { i++; show(); }, 1100);
      }));
    };
    show();
  }
  function openQuests() {
    if (TOUR.on) stopTour();
    const n = SANDALS.filter((x) => x.found).length, b = myBadges(), got = BADGES.filter((x) => b[x[0]]).length;
    const hints = SANDALS.filter((x) => !x.found).slice(0, 3).map((x) => `<li>${tr(`在「${x.s.d.name}」島的邊角，轉個角度找找`, `Near the edge of ${x.s.d.en}. Try rotating the view.`)}</li>`).join('');
    openModal(`<div class="eyebrow">🏅 ${tr('小任務', 'Quests')}</div><h2>${tr('找小草鞋 · 政見問答 · 徽章', 'Sandals · quiz · badges')}</h2>
      <p class="modal-p">${tr('草屯舊名草鞋墩。島上藏了 10 隻小草鞋，點牠就算找到，漫步時走過去也可以。', 'Caotun was once “straw-sandal mound”. 10 little sandals are hidden on the islands: tap one, or walk up to it.')} <b>${n} / ${SANDALS.length}</b></p>
      <div class="prog"><i style="width:${n / SANDALS.length * 100}%"></i></div>
      ${hints ? `<ul class="hints">${hints}</ul>` : `<p class="modal-p">🎉 ${tr('全部找到了！', 'All found!')}</p>`}
      <div class="eyebrow">${tr('徽章', 'Badges')} · ${got} / ${BADGES.length}</div>
      <div class="badges">${BADGES.map((x) => `<div class="badge${b[x[0]] ? ' got' : ''}" title="${esc(tr(x[4], x[5]))}"><b>${x[1]}</b>${esc(tr(x[2], x[3]))}<small>${esc(tr(x[4], x[5]))}</small></div>`).join('')}</div>
      <div class="modal-acts"><button class="btn foot-btn" id="qReset">${tr('重新開始', 'Reset')}</button><button class="btn primary" id="qQuiz">🎓 ${tr('開始政見問答', 'Start the quiz')}</button></div>
      <button class="btn modal-x" data-close aria-label="${tr('關閉', 'Close')}">✕</button>`);
    $('#qQuiz').addEventListener('click', startQuiz);
    $('#qReset').addEventListener('click', () => {
      store.set('sandals', []); store.set('badges', {}); store.set('seasons', {});
      for (const t of SANDALS) { t.found = false; t.jump = 0; t.g.visible = true; t.g.scale.setScalar(1); }
      openQuests(); dirty = true;
    });
  }
  $('#btnQuest').addEventListener('click', openQuests);

  // ───────────────────────── 3. 我的路 ─────────────────────────
  // 鎮民選身分與關心的事，從政見原文裡挑出相關項目，排成一條走訪路線
  // （主題與政見的對應是依政見文字整理的，只決定推薦順序；顯示的內容都是網站原文）
  const TOPICS = {
    traffic: ['🚗', '交通與停車', 'Transport & parking', ['i02d', 'i07a', 'i07b', 'i07c', 'i12d', 'i12e', 'i12f', 'i12g', 'i09e']],
    walk: ['🚸', '走路安全', 'Safe walking', ['i04a', 'i04b', 'i04c', 'i04d', 'i04e', 'i04f']],
    baby: ['👶', '育兒托育', 'Childcare', ['i01a', 'i01c', 'i02a', 'i02b', 'i02c', 'i02d', 'i02e', 'i02f']],
    kids: ['📚', '孩子的教育', 'Kids’ education', ['i03a', 'i03c', 'i03d', 'i03f', 'i02e', 'i04c']],
    health: ['💪', '運動健康', 'Sports & health', ['i01a', 'i01b', 'i01d', 'i01f']],
    elder: ['👵', '長輩友善', 'Senior friendly', ['i01d', 'i01e', 'i04f', 'i06a', 'i02d', 'i04e']],
    disaster: ['🌧', '防災', 'Disaster safety', ['i05a', 'i05b', 'i05c', 'i05d', 'i05e']],
    heat: ['🌡', '抗高溫與生態', 'Heat & ecology', ['i06a', 'i06b', 'i06c', 'i06d', 'i06e', 'i06f', 'i01e']],
    shop: ['🏪', '商圈與創業', 'Shops & startups', ['i08a', 'i08b', 'i08c', 'i08d', 'i08e', 'i08f', 'i07a']],
    farm: ['🌾', '農業', 'Farming', ['i05d', 'i08f']],
    tour: ['🏯', '觀光文化', 'Tourism & culture', ['i09a', 'i09b', 'i09c', 'i09d', 'i09e', 'i09f', 'i09g', 'i08e']],
    digital: ['📱', '數位便民', 'Digital services', ['i10a', 'i10b', 'i10c', 'i02e', 'i06b', 'i05c']],
    youth: ['🙋', '青年參與', 'Youth voice', ['i11a', 'i11b', 'i11c', 'i11d', 'i11e', 'i03b', 'i03e', 'i08d']],
    region: ['🌐', '區域發展', 'Regional growth', ['i12a', 'i12b', 'i12c', 'i09g']]
  };
  const ROLES = {
    elder: ['👵', '長輩', 'Senior', ['elder', 'health', 'walk']],
    parent: ['👨‍👩‍👧', '家長', 'Parent', ['baby', 'kids', 'walk']],
    youth: ['🎒', '學生、青年', 'Student / youth', ['youth', 'traffic']],
    commuter: ['🛵', '上班通勤', 'Commuter', ['traffic', 'walk']],
    shop: ['🏪', '店家、創業', 'Shop owner', ['shop', 'tour']],
    farmer: ['🌾', '農民', 'Farmer', ['farm', 'disaster']],
    visitor: ['🧳', '遊客', 'Visitor', ['tour', 'traffic']],
    resident: ['🏡', '一般鎮民', 'Resident', ['digital', 'disaster']]
  };
  const PATH = { group: null, pins: [], mat: null };
  function openPath() {
    if (TOUR.on) stopTour();
    const sel = { role: store.get('pathRole', 'resident'), topics: new Set(store.get('pathTopics', ROLES.resident[3])) };
    const draw = () => {
      openModal(`<div class="eyebrow">🗺 ${tr('我的路', 'My path')}</div><h2>${tr('找到你關心的政見', 'Find the policies for you')}</h2>
        <p class="modal-p">${tr('我是：', 'I am a:')}</p>
        <div class="chips-row">${Object.entries(ROLES).map(([k, v]) => `<button class="chip pick${sel.role === k ? ' on' : ''}" data-role="${k}">${v[0]} ${esc(tr(v[1], v[2]))}</button>`).join('')}</div>
        <p class="modal-p">${tr('我關心（可複選）：', 'I care about (pick any):')}</p>
        <div class="chips-row">${Object.entries(TOPICS).map(([k, v]) => `<button class="chip pick${sel.topics.has(k) ? ' on' : ''}" data-topic="${k}">${v[0]} ${esc(tr(v[1], v[2]))}</button>`).join('')}</div>
        <div class="modal-acts"><button class="btn foot-btn" data-close>${tr('取消', 'Cancel')}</button><button class="btn primary" id="pathGo">🗺 ${tr('帶我去看', 'Show me')}</button></div>`);
      modalBody.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => { sel.role = b.dataset.role; sel.topics = new Set(ROLES[sel.role][3]); draw(); }));
      modalBody.querySelectorAll('[data-topic]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.topic; if (sel.topics.has(k)) sel.topics.delete(k); else sel.topics.add(k); draw(); }));
      $('#pathGo').addEventListener('click', () => {
        if (!sel.topics.size) { toast(tr('至少選一個關心的事喔', 'Pick at least one topic')); return; }
        store.set('pathRole', sel.role); store.set('pathTopics', [...sel.topics]);
        closeModal(); planPath(sel.role, [...sel.topics]);
      });
    };
    draw();
  }
  function planPath(role, topics) {
    // 依關心的主題收集政見，按島分組
    const ids = [...new Set(topics.flatMap((k) => TOPICS[k][3]))].filter((id) => itemById[id]);
    const byIsl = new Map();
    ids.forEach((id) => { const s = itemById[id].s; if (!byIsl.has(s)) byIsl.set(s, []); byIsl.get(s).push(id); });
    // 從畫面中心最近的島出發，每次走到最近的下一座
    const left = new Set(byIsl.keys()), seq = [];
    let cur = null, bd = 1e9;
    left.forEach((s) => { const d = s.c.distanceTo(controls.target); if (d < bd) { bd = d; cur = s; } });
    while (cur) {
      seq.push(cur); left.delete(cur);
      let next = null; bd = 1e9;
      left.forEach((s) => { const d = s.c.distanceTo(cur.c); if (d < bd) { bd = d; next = s; } });
      cur = next;
    }
    drawPath(seq);
    clearSelection();
    const R0 = ROLES[role];
    let h = `<div class="eyebrow">🗺 ${tr('我的路', 'My path')}</div><h2>${tr(`${R0[1]}關心的政見`, `For a ${R0[2].toLowerCase()}`)}</h2>
      <div class="chips-row">${topics.map((k) => `<span class="chip">${TOPICS[k][0]} ${esc(tr(TOPICS[k][1], TOPICS[k][2]))}</span>`).join('')}</div>
      <p class="path-note">${tr(`地圖上的黃色路線依序走過這 ${seq.length} 座島，共 ${ids.length} 項政見。點政見可以看原文。`, `The yellow route visits ${seq.length} islands with ${ids.length} policies. Tap one to read it.`)}</p>`;
    seq.forEach((s, k) => {
      h += `<div class="path-step"><span class="dot">${k + 1}</span><div><button class="chip btnlike" data-isl="${s.d.id}">${s.d.icon || ''} ${esc(tr(s.d.name, s.d.en))}</button>
        <ul>${byIsl.get(s).map((id) => { const it = itemById[id].it; return `<li><button class="link" data-item="${id}"><b>${esc(tr(it.name, it.en))}</b>${it.desc && it.desc !== it.name ? `<span>${esc(it.desc)}</span>` : ""}</button></li>`; }).join('')}</ul></div></div>`;
    });
    h += `<p class="path-note small">${tr('依你選的主題整理，僅供參考；完整政見請看各島卡片或 542upup.tw。', 'Grouped by the topics you picked. See each island or 542upup.tw for the full platform.')}</p>
      <div class="modal-acts"><button class="btn foot-btn" id="pathClear">${tr('清除路線', 'Clear')}</button><button class="btn primary" id="pathAgain">${tr('重新選擇', 'Change')}</button></div>`;
    pathBody.innerHTML = h; pathEl.hidden = false;
    pathBody.querySelectorAll('[data-isl]').forEach((b) => b.addEventListener('click', () => selectIsland(b.dataset.isl)));
    pathBody.querySelectorAll('[data-item]').forEach((b) => b.addEventListener('click', () => selectItem(b.dataset.item)));
    $('#pathClear').addEventListener('click', () => { clearPath(); pathEl.hidden = true; });
    $('#pathAgain').addEventListener('click', openPath);
    const c = new THREE.Vector3(); seq.forEach((s) => c.add(s.c)); c.divideScalar(seq.length).setY(TOP);
    const span = Math.max(...seq.map((s) => s.c.distanceTo(c)));
    flyTo(c, ISL_OFF.clone().multiplyScalar(THREE.MathUtils.clamp(1 + span / 3.2, 1.2, 3.2) * (isDesk() ? 1 : 1.6)), { noShift: true });
    youLog('you', tr(`規劃了一條「${topics.map((k) => TOPICS[k][1]).join('、')}」的政見路線`, `Planned a path: ${topics.map((k) => TOPICS[k][2]).join(', ')}`));
    award('path');
  }
  const pathEl = $('#pathCard'), pathBody = $('#pathBody');
  $('#pathClose').addEventListener('click', () => { clearPath(); pathEl.hidden = true; });
  function clearPath() {
    if (PATH.group) { scene.remove(PATH.group); PATH.group.traverse((o) => { if (o.isMesh) o.geometry.dispose(); }); }
    PATH.pins.forEach((o) => { scene.remove(o); o.element.remove(); });
    PATH.group = null; PATH.pins = []; dirty = true;
  }
  function drawPath(seq) {
    clearPath();
    PATH.group = new THREE.Group(); scene.add(PATH.group);
    const pts = [];
    for (let k = 1; k < seq.length; k++) { const pl = polyline(route(seq[k - 1], seq[k])); pts.push(...pl.pts); }
    if (seq.length === 1) { const s = seq[0]; pts.push(s.c.clone().setX(s.c.x - .6).setY(TOP), s.c.clone().setX(s.c.x + .6).setY(TOP)); }
    const cp = new THREE.CurvePath();
    for (let k = 1; k < pts.length; k++) { const a = pts[k - 1].clone(), b = pts[k].clone(); a.y += .08; b.y += .08; if (a.distanceTo(b) > 1e-4) cp.add(new THREE.LineCurve3(a, b)); }
    const len = cp.getLength();
    PATH.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 }, uLen: { value: len }, uColor: { value: new THREE.Color('#f2c230') } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
      fragmentShader: `uniform float uTime,uLen; uniform vec3 uColor; varying vec2 vUv;
        void main(){ float f = fract(vUv.x * uLen * 3. - uTime * 1.2); if (f > .62) discard; gl_FragColor = vec4(uColor, .95);
          #include <colorspace_fragment>
        }`
    });
    const m = new THREE.Mesh(new THREE.TubeGeometry(cp, Math.max(40, Math.ceil(len * 10)), .055, 6, false), PATH.mat);
    m.renderOrder = 7; PATH.group.add(m);
    seq.forEach((s, k) => {
      const el = document.createElement('button');
      el.className = 'path-pin'; el.textContent = k + 1; el.title = tr(s.d.name, s.d.en);
      el.addEventListener('click', (e) => { e.stopPropagation(); selectIsland(s); });
      const o = new CSS2DObject(el); o.position.set(s.c.x, TOP + 1.5, s.c.z); scene.add(o); PATH.pins.push(o);
    });
    dirty = true;
  }
  onFrame.push((dt, animate) => { if (PATH.mat && animate) PATH.mat.uniforms.uTime.value += dt; });
  $('#btnPath').addEventListener('click', openPath);
  Object.assign(window.__walk, { WX, applyWeather, applySeason, SANDALS, findSandal, planPath, openQuests, startQuiz });


  // ───────────────────────── 尺寸 ─────────────────────────
  function resize() {
    const w = stageEl.clientWidth || innerWidth, h = stageEl.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    labelRenderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    dirty = true;
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();
  overview();
  setTime(600);

  // ───────────────────────── 迴圈 ─────────────────────────
  const PAN_R = Math.max(...islands.map((s) => Math.hypot(s.c.x - center.x, s.c.z - center.z))) + R;
  const _pan = new THREE.Vector3();
  function clampPan() {
    _pan.set(controls.target.x - center.x, 0, controls.target.z - center.z);
    const over = _pan.length() - PAN_R;
    const dy = TOP - controls.target.y;
    if (over <= 0 && Math.abs(dy) < 1e-4) return;
    if (over > 0) _pan.setLength(over).negate(); else _pan.set(0, 0, 0);
    _pan.y = dy;
    controls.target.add(_pan); camera.position.add(_pan);
  }
  controls.addEventListener('change', () => { if (!fly) clampPan(); dirty = true; });
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.08);
    const animate = !reduceMQ.matches && !paused;
    if (animate) {
      elapsed += dt;
      waterU.uTime.value = elapsed;
      dirty = true;
      {
        world.minutes = (world.minutes + dt * 10) % 1440;
        const tenth = Math.floor(world.minutes);
        if (tenth !== lastMinuteShown) { applyTime(world.minutes); }
      }
    }
    const shown = Math.floor(world.minutes);
    if (shown !== lastMinuteShown) { clockEl.textContent = fmt(shown); lastMinuteShown = shown; }
    onFrame.forEach((f) => f(dt, animate));
    if (controls.enabled) controls.update(); // 漫步時由第一人稱鏡頭接手
    if (!dirty) return;
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    afterRender.forEach((f) => f());
    dirty = false;
  }
  frame();
  reduceMQ.addEventListener?.('change', () => { dirty = true; });

  requestAnimationFrame(() => $('#loading').classList.add('done'));
  window.__city = { scene, camera, controls, renderer, setTime, islands };
}
