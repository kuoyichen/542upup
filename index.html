<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>草屯鎮政策島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="張媛婷 2026 草屯鎮長政見：五大升級、十二座政策島的 3D 互動城市。">
<style>
/* 版面：滿版 3D 舞台，介面元件浮在四角。單一暖色黏土世界，不做深色主題。 */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --glass:#86a8a6; --wood:#b48560; --teal:#3e7c8c;
  --paper:rgba(255,250,245,.78); --line:rgba(33,29,29,.10);
  --shadow:0 1px 2px #4a2a1410,0 6px 18px #4a2a1414,0 18px 48px #4a2a1412;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-num:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
.eyebrow{font:700 10px/1.2 var(--f-mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
.btn{min-height:44px;border-radius:9px;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--f-ui);cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"],.btn:active{background:var(--ink);color:var(--cream)}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;box-shadow:0 2px 8px #4a2a1414;padding:6px 12px;font-size:12px;border:0;color:var(--ink)}

/* island label pill */
.isl-label{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;background:rgba(255,248,244,.94);box-shadow:0 2px 8px #4a2a1420;font:600 13px/1 var(--f-ui);white-space:nowrap;transition:opacity .25s,background .2s,color .2s;user-select:none}
.isl-label b{font:700 10px/1 var(--f-mono);letter-spacing:1px;color:#fff;background:var(--coral);border-radius:999px;padding:4px 6px}
.isl-label.sel{background:var(--ink);color:var(--cream)}
.isl-label.dim{opacity:.45}

/* loading */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading .in{text-align:center;padding:0 24px}
#loading h1{margin:10px 0 6px;font-size:clamp(34px,7vw,64px);letter-spacing:4px;font-weight:900}
#loading p{margin:0;color:#6b5a50;font-size:15px}
#loading .err{margin-top:18px;color:#a3301a;font-size:14px;max-width:420px;line-height:1.6;white-space:pre-wrap}
.dots i{display:inline-block;width:8px;height:8px;margin:18px 4px 0;border-radius:50%;background:var(--coral);animation:bob 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--yellow)}.dots i:nth-child(3){animation-delay:.3s;background:var(--teal)}
@keyframes bob{50%{transform:translateY(-8px)}}

/* brand */
#brand{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
#brand .photo{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--stone)}
#brand h1{margin:2px 0 0;font-size:20px;font-weight:900;letter-spacing:1px}
#brand h1 span{color:var(--coral)}
#brand .sub{font-size:12px;color:#6b5a50;margin-top:2px}

/* tools */
#tools{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.btn .ic{font-size:16px;line-height:1}
.tool,#hud .hud-group .btn,#btnTime{flex-direction:column;gap:3px;font-size:11px;min-width:52px;padding:4px 8px}

/* sheets: card (left) and side (right) */
.sheet{position:fixed;z-index:12;background:rgba(255,250,245,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.grab{display:none}
#card{left:max(16px,env(safe-area-inset-left,0px));top:calc(176px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 176px - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:22px;box-shadow:0 1px 2px #4a2a1412,0 8px 24px #4a2a1418,0 28px 64px #4a2a1420}
#card .close{position:absolute;right:8px;top:8px;width:44px;z-index:2}
.card-body{overflow-y:auto;padding:22px 22px 24px;overscroll-behavior:contain}
.card-body h2{margin:6px 44px 4px 0;font-size:24px;line-height:1.25;font-weight:900;text-wrap:balance}
.card-body .lead{margin:8px 0 14px;font-size:14px;line-height:1.7;color:#4a3f3a}
.card-body .quote{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--cream);font-size:15px;line-height:1.75;border:1px solid var(--line)}
.card-body .quote small{display:block;margin-top:6px;font:700 10px/1.2 var(--f-mono);letter-spacing:2px;color:#8a7a70}
.card-body h3{margin:18px 0 8px;font:700 10px/1.2 var(--f-mono);letter-spacing:2px;color:#8a7a70;text-transform:uppercase}
.isl-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;color:var(--ink);box-shadow:inset 0 -3px 0 #0000001a}
.card-top{display:flex;gap:12px;align-items:center}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items button{width:100%;text-align:left;justify-content:flex-start;gap:10px;font-weight:500;line-height:1.35;padding:8px 10px;min-height:44px}
.num{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--coral);color:#fff;font:700 12px/1 var(--f-ui)}
.num.lit{background:var(--yellow);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.btnlike{cursor:pointer}
.chip.btnlike:hover{background:var(--yellow)}
.chip.cream{background:var(--cream)}
.thumb{width:160px;height:160px;border-radius:18px;background:var(--cream);display:block;margin:4px auto 6px;box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:12px 0}
.stat{padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 2px 8px #4a2a1414}
.stat b{display:block;font:italic 28px/1.05 var(--f-num);color:var(--coral)}
.stat span{font-size:12px;color:#6b5a50}
.when{display:flex;gap:6px;flex-wrap:wrap}
.when .chip{background:var(--yellow)}
.src{display:inline-block;margin-top:16px;font-size:12px;color:var(--teal)}
.lvl{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.lvl i{display:inline-block;width:34px;height:0;border-top:3px solid var(--coral)}
.lvl.thematic i{border-top-style:dashed}.lvl.pending i{border-top-style:dotted}
.flowline{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:700}
.flowline .arrow{color:var(--coral);font-size:20px}

#side{right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));width:318px;border-radius:22px;background:rgba(255,250,245,.72)}
.side-head{padding:14px 14px 8px;display:grid;gap:10px}
#search{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font:14px var(--f-ui);color:var(--ink)}
#search:focus-visible{outline:3px solid var(--coral);outline-offset:1px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:3px;border-radius:12px;background:#4a2a140d}
.tab{min-height:40px;border-radius:9px;border:0;background:transparent;font:600 13px var(--f-ui);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:#fff;box-shadow:0 2px 8px #4a2a1414}
.tab:focus-visible{outline:3px solid var(--coral)}
.side-body{overflow-y:auto;padding:4px 10px 16px;overscroll-behavior:contain}
.pillar-h{margin:14px 6px 6px}
.pillar-h .eyebrow{display:block}
.pillar-h small{font-size:12px;color:#6b5a50}
details.isl{border-radius:14px;margin:4px 0}
details.isl[open]{background:#fff;box-shadow:0 2px 8px #4a2a1414}
details.isl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:12px;font-weight:700}
details.isl summary::-webkit-details-marker{display:none}
details.isl summary:hover{background:var(--yellow)}
details.isl summary:focus-visible{outline:3px solid var(--coral)}
details.isl summary .no{font:700 10px/1 var(--f-mono);letter-spacing:1px;color:#fff;background:var(--coral);border-radius:999px;padding:4px 6px}
details.isl summary .cnt{margin-left:auto;font-size:12px;color:#8a7a70;font-weight:500}
details.isl .items{padding:0 6px 8px}
.flowrow{width:100%;text-align:left;justify-content:flex-start;flex-wrap:wrap;gap:4px 10px;padding:10px;min-height:56px;font-weight:500}
.flowrow b{font-weight:700}
.empty{padding:20px 10px;color:#8a7a70;font-size:13px}
mark{background:var(--yellow);color:inherit;border-radius:3px}

/* HUD */
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#hud .btn{border-radius:999px}
#btnTime{display:none}
.hud-group{display:flex;gap:2px}
.hud-time{display:flex;flex-direction:column;align-items:center;padding:0 10px 0 14px;min-width:84px}
.hud-time .time{font:italic 22px/1 var(--f-num)}
.hud-time .slot{font-size:10px;color:#8a7a70;margin-top:3px;white-space:nowrap}
.hud-sep{width:1px;height:30px;background:var(--line);margin:0 4px}

/* log */
#log{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:11;width:300px;max-height:40vh;display:flex;flex-direction:column;border-radius:18px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow:hidden}
body.side-open #log{right:calc(318px + 32px + env(safe-area-inset-right,0px))}
.log-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--f-mono);letter-spacing:2px;color:#2e8b57}
.live i{width:8px;height:8px;border-radius:50%;background:#34c46a;box-shadow:0 0 0 3px #34c46a33;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #34c46a00}}
#logFilter{margin-left:auto;min-height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font:12px var(--f-ui);max-width:120px}
#logList{list-style:none;margin:0;padding:6px 8px;overflow-y:auto;font-size:12px;line-height:1.5}
#logList li{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:5px 4px;border-bottom:1px dashed var(--line)}
#logList time{font:italic 13px var(--f-num);color:#8a7a70}
#logList .k{font:700 9px var(--f-mono);letter-spacing:1px;color:var(--coral);margin-right:4px}

#legend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:14px;padding:8px 14px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:12px;white-space:nowrap}

/* help */
#help{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#211d1d55;padding:16px}
.help-in{width:min(440px,100%);border-radius:22px;background:var(--cream);padding:26px;box-shadow:0 30px 80px #211d1d55}
.help-in h2{margin:6px 0 14px;font-size:26px;font-weight:900}
.help-in ol{margin:0 0 20px;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.help-in li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:2px 10px;font-size:14px;line-height:1.55}
.help-in li::before{content:counter(s);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:italic 700 16px var(--f-num)}
.help-in li span{color:#6b5a50}
.btn.primary{background:var(--ink);color:var(--cream);width:100%;font-size:15px}
.btn.primary:hover{background:var(--coral)}

/* pins */
.pin{width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--f-ui);box-shadow:0 2px 6px #4a2a1440;pointer-events:auto;cursor:pointer;border:2px solid #fff}
.pin.lit{background:var(--yellow);color:var(--ink)}
.pin.sel{background:var(--ink)}
.isl-label.short .nm{display:none}
.isl-label.hide{visibility:hidden}
.bubble{padding:4px 9px;border-radius:999px;background:#fff;box-shadow:0 2px 8px #4a2a1426;font:600 11px/1.2 var(--f-ui);white-space:nowrap;transform:translateY(-6px);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:#fff;border-bottom:0}

/* 手機版 ≤800px */
@media (max-width:800px){
  #brand{padding:8px 12px;gap:8px;border-radius:14px;max-width:calc(100% - 128px)}
  #brand .photo{width:34px;height:34px}
  #brand h1{font-size:15px;line-height:1.25}
  .tool{min-width:52px;font-size:10px}
  #brand .sub{display:none}
  #tools{left:auto;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));flex-direction:column}
  .sheet{left:0!important;right:0!important;bottom:0!important;top:auto!important;width:auto!important;max-height:none!important;border-radius:22px 22px 0 0!important;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s ease}
  .sheet.dragging{transition:none}
  #card{height:34%;z-index:14}
  #side{height:52%;z-index:13}
  .grab{display:block;flex:none;height:28px;cursor:grab;touch-action:none;position:relative}
  .grab::before{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#211d1d33}
  .card-body{padding:4px max(18px,env(safe-area-inset-left,0px)) 24px max(18px,env(safe-area-inset-right,0px))}
  #card .close{top:2px}
  .card-body h2{font-size:21px}
  .thumb{width:120px;height:120px}
  #hud{gap:0;padding:4px}
  #btnTime{display:inline-flex}
  .hud-time,#timeBtns,.hud-sep{display:none}
  #hud.time-open .hud-time,#hud.time-open #timeBtns{display:flex}
  #hud.time-open .hud-time{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 64px);padding:6px 14px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow)}
  #hud.time-open #timeBtns{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);padding:4px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow)}
  #hud .hud-group .btn,#btnTime{min-width:44px;padding:4px 5px;font-size:10px}
  #log{left:max(16px,env(safe-area-inset-left,0px));right:calc(84px + env(safe-area-inset-right,0px));width:auto;top:calc(72px + env(safe-area-inset-top,0px));max-height:30vh}
  body.side-open #log{right:calc(84px + env(safe-area-inset-right,0px))}
  #legend{bottom:calc(76px + env(safe-area-inset-bottom,0px));gap:10px;font-size:11px;padding:6px 12px}
  .isl-label{font-size:12px;padding:4px 9px 4px 5px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.cand-label{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--coral);color:#fff;font:800 12px/1 var(--f-ui);letter-spacing:1px;box-shadow:0 3px 10px #4a2a1440;white-space:nowrap;pointer-events:auto;cursor:pointer;border:2px solid #fff}
.cand-label i{font-style:normal;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--coral);display:grid;place-items:center;font-size:10px}
.cand-act{display:block;margin-top:4px;padding:3px 8px;border-radius:999px;background:#fff;color:var(--ink);font:600 10px/1.2 var(--f-ui);letter-spacing:0;box-shadow:0 2px 6px #4a2a1420;text-align:center}
.cand-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--stone)}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.vids button{width:100%;text-align:left;justify-content:flex-start;gap:10px;font-weight:500;line-height:1.35;padding:8px 10px;min-height:44px}
.play{flex:none;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:#fff;font-size:10px;padding-left:2px}
.vid-group{margin:14px 6px 6px}
.isl-label .vid{font-style:normal;font-size:9px;color:var(--coral);margin-left:-2px}
.isl-label.sel .vid{color:var(--yellow)}
#player{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:#211d1dcc;padding:16px}
.player-in{width:min(860px,100%);border-radius:22px;background:var(--cream);padding:16px;box-shadow:0 30px 80px #0008}
.player-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.player-head h2{margin:4px 0 0;font-size:20px;line-height:1.3;text-wrap:balance}
#playerVideo{width:100%;max-height:70vh;border-radius:14px;background:#000;display:block}
.player-note{margin:10px 2px 0;font-size:13px;color:#6b5a50}
</style>
</head>
<body>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<div id="stage"></div>
<div id="labels"></div>

<header id="brand">
  <img class="photo" id="brandPhoto" alt="" hidden>
  <div>
    <div class="eyebrow" id="brandEyebrow"></div>
    <h1 id="brandTitle"></h1>
    <div class="sub" id="brandSub"></div>
  </div>
</header>

<nav id="tools" aria-label="檢視">
  <button class="btn tool" id="btnOverview" title="全景"><span class="ic">⌂</span><span data-en="Overview">全景</span></button>
  <button class="btn tool" id="btnList" aria-pressed="false" aria-controls="side"><span class="ic">☰</span><span data-en="List">清單</span></button>
  <button class="btn tool" id="btnHelp" aria-label="說明"><span class="ic">?</span><span data-en="Help">說明</span></button>
</nav>

<aside id="card" class="sheet" hidden aria-live="polite">
  <div class="grab" aria-hidden="true"></div>
  <button class="btn close" id="cardClose" aria-label="關閉卡片">✕</button>
  <div class="card-body" id="cardBody"></div>
</aside>

<aside id="side" class="sheet" hidden aria-label="政策清單">
  <div class="grab" aria-hidden="true"></div>
  <div class="side-head">
    <input id="search" type="search" placeholder="搜尋政見，例如：托育、防災" aria-label="搜尋政見" autocomplete="off">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabTopics" aria-selected="true" data-en="Policy topics">政策主題</button>
      <button class="tab" role="tab" id="tabFlows" aria-selected="false" data-en="Connections">協作關係</button>

<script type="module">
// ───────────────────────── 基本工具 ─────────────────────────
const $ = (s) => document.querySelector(s);
const LANG = (() => { try { return new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } })();
const tr = (zh, en) => (LANG === 'en' && en ? en : zh);
const store = {
  get(k, d) { try { const v = localStorage.getItem('542upup:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('542upup:' + k, JSON.stringify(v)); } catch (e) { /* 私密模式 */ } }
};
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(5422026);
const rr = (a, b) => a + (b - a) * rand();

function fail(err) {
  console.error(err);
  $('#loadingDots').hidden = true;
  $('#loadingMsg').textContent = tr('城市組合失敗', 'Could not build the city');
  const box = $('#loadingErr');
  box.hidden = false;
  box.textContent = tr('可能是瀏覽器不支援 WebGL，或網路無法載入 Three.js。請重新整理，或改用最新版 Chrome／Safari。', 'Your browser may not support WebGL, or Three.js could not be downloaded. Reload, or try a recent Chrome or Safari.') + '\n\n' + (err && err.message ? err.message : String(err));
  $('#loading').classList.remove('done');
}

// ───────────────────────── 常數 ─────────────────────────
const R = 2.02, SPACING = 2.28, TOP = 0.65, WATER_Y = -0.18;
const SQ3 = Math.sqrt(3);
const PATH_R = 1.8;
const C = {
  coral: '#db6a41', ink: '#211d1d', cream: '#fff8f4', yellow: '#fcea8b', stone: '#c5b5a7', green: '#71806a',
  glass: '#86a8a6', wood: '#b48560', teal: '#3e7c8c', plant: ['#9cc27a', '#8db86f', '#728f5f'],
  pastel: ['#f2b5c6', '#58a6a6', '#6f7fb5'], curb: '#e4d6c3', path: '#e8cdb0', glow: '#ffc777'
};
const isMobile = matchMedia('(max-width: 800px)').matches;
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');

// ───────────────────────── 品牌卡 ─────────────────────────
(function brand() {
  const c = DATA.city;
  $('#brandEyebrow').textContent = tr(c.role, c.roleEn);
  $('#brandTitle').innerHTML = `${tr(c.candidate, c.candidateEn)} <span>${tr('政策島', 'Policy Islands')}</span>`;
  $('#brandSub').textContent = tr(c.slogan, c.sloganEn);
  const img = $('#brandPhoto');
  img.onload = () => { img.hidden = false; };
  img.onerror = () => { img.remove(); };
  img.src = c.images.hero;
  if (LANG === 'en') {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach((el) => { el.textContent = el.dataset.en; });
    const aria = { '#tools': 'View', '#cardClose': 'Close card', '#side': 'Policy list', '#search': 'Search policies', '#log': 'City log', '#logFilter': 'Filter by link', '#hud': 'Time and display', '#btnHelp': 'Help', '#hud > #btnTime': 'Time' };
    Object.entries(aria).forEach(([q, v]) => { const el = $(q); if (el) el.setAttribute('aria-label', v); });
    $('#loadingMsg').textContent = 'Assembling the policy city…';
    $('#loading h1').textContent = 'Caotun Policy Islands';
  }
  document.title = tr(c.title, c.titleEn);
})();

let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, BufferGeometryUtils, SimplexNoise;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js'));
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  BufferGeometryUtils = await import('three/addons/utils/BufferGeometryUtils.js');
  ({ SimplexNoise } = await import('three/addons/math/SimplexNoise.js'));
  init();
} catch (err) {
  fail(err);
}

function init() {
  let dirty = true;
  const onFrame = [];
  const afterRender = [];
  // ───────────────────────── Renderer ─────────────────────────
  const stageEl = $('#stage');
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('WebGL unavailable');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.4 : 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  stageEl.appendChild(renderer.domElement);
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('aria-label', tr('草屯鎮政策島 3D 城市', 'Caotun policy islands 3D city'));

  const labelRenderer = new CSS2DRenderer({ element: $('#labels') });

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.3, 320);

  // ───────────────────────── 島嶼座標 ─────────────────────────
  const axial = (q, r) => new THREE.Vector3(SQ3 * SPACING * (q + r / 2), 0, 1.5 * SPACING * r);
  const islands = DATA.islands.map((d, i) => ({ d, i, c: axial(d.q, d.r) }));
  const byId = Object.fromEntries(islands.map((s) => [s.d.id, s]));
  const center = new THREE.Vector3();
  islands.forEach((s) => center.add(s.c));
  center.divideScalar(islands.length);
  center.y = TOP;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = 3;

  // 直式螢幕：把方位轉到城市最窄的那一面，讓 12 座島都能入鏡
  const PORTRAIT = (() => {
    const base = Math.atan2(OVERVIEW_DIR.x, OVERVIEW_DIR.z), hor = Math.hypot(OVERVIEW_DIR.x, OVERVIEW_DIR.z);
    let best = null;
    for (let deg = -80; deg <= 80; deg += 4) {
      const a = base + THREE.MathUtils.degToRad(deg);
      const hx = Math.sin(a), hz = Math.cos(a);
      let lo = 1e9, hi = -1e9;
      islands.forEach((s) => { const p = (s.c.x - center.x) * hz - (s.c.z - center.z) * hx; lo = Math.min(lo, p); hi = Math.max(hi, p); });
      const w = hi - lo + 2 * R + Math.abs(deg) * .02;
      if (!best || w < best.score) best = { score: w, w: hi - lo + 2 * R, mid: (hi + lo) / 2, hx, hz, dir: new THREE.Vector3(hx * hor, OVERVIEW_DIR.y, hz * hor).normalize() };
    }
    return best;
  })();
  const overviewDir = () => (innerWidth / innerHeight < .8 ? PORTRAIT.dir : OVERVIEW_DIR);
  function overviewDistance() {
    const a = innerWidth / innerHeight;
    if (a > 1.25) return 28.5;
    if (a > 0.8) return 38;
    const need = (PORTRAIT.w / 2 + 2.4) / (Math.tan(THREE.MathUtils.degToRad(16)) * a);
    return THREE.MathUtils.clamp(need, 40, 68);
  }
  function overviewTarget() {
    const t = center.clone();
    if (innerWidth / innerHeight < .8) { t.x += PORTRAIT.hz * PORTRAIT.mid; t.z -= PORTRAIT.hx * PORTRAIT.mid; }
    if (innerWidth > 800 && document.body.classList.contains('side-open')) {
      const d = overviewDir();
      t.x += d.z * 2.4; t.z += -d.x * 2.4;
    }
    return t;
  }
  function overview() {
    controls.target.copy(overviewTarget());
    camera.position.copy(controls.target).addScaledVector(overviewDir(), overviewDistance());
    controls.update();
    dirty = true;
  }

  // ───────────────────────── 天空 ─────────────────────────
  const skyU = {
    uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSun: { value: new THREE.Color() }, uNight: { value: 0 }
  };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(170, 48, 24), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uTop,uHorizon,uSun,uSunDir; uniform float uNight; varying vec3 vDir;
      float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
      void main(){
        vec3 d = normalize(vDir);
        vec3 c = mix(uHorizon, uTop, smoothstep(-.02,.55,d.y));
        float s = max(dot(d, normalize(uSunDir)), 0.);
        c += uSun * pow(s, 18.) * .35;

  }));

  // ───────────────────────── 光 ─────────────────────────
  const hemi = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.3);

  sun.shadow.mapSize.set(2048, 2048);

  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.045;
  sun.shadow.radius = 3;
  sun.target.position.copy(center);
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.copy(center).add(new THREE.Vector3(-20, 12, -14));
  fill.target.position.copy(center);

  // ───────────────────────── 水 ─────────────────────────
  const waterU = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uShallow: { value: new THREE.Color('#a4d4da') }, uDeep: { value: new THREE.Color('#6fa9b8') },
    uTime: { value: 0 }, uCenter: { value: new THREE.Vector2(center.x, center.z) }, uNight: { value: 0 }
  }]);
  const waterVS = `#include <fog_pars_vertex>
    varying vec3 vW;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`;
  const waterFS = (wall) => `#include <fog_pars_fragment>
    uniform vec3 uShallow,uDeep; uniform float uTime,uNight; uniform vec2 uCenter; varying vec3 vW;
    void main(){
      float d = length(vW.xz - uCenter);
      float w = sin(vW.x*.33 + uTime*.35) * sin(vW.z*.29 - uTime*.28) * .5 + sin((vW.x - vW.z)*.8 + uTime*.6) * .25;
      ${wall
        ? `float k = clamp((${TOP.toFixed(2)} - vW.y) / 1.1, 0., 1.);
           vec3 c = mix(uShallow * .96, uDeep * .78, .25 + k * .75) + w * .015;`
        : `float t = smoothstep(9., 70., d);
           vec3 c = mix(uShallow, uDeep, clamp(t + w * .07, 0., 1.)) + w * .02;
           float sp = sin(vW.x*5.3 + uTime*1.2) * sin(vW.z*4.9 - uTime*1.05) * sin((vW.x+vW.z)*2.1 + uTime*.7);
           c += smoothstep(.93, 1., sp) * (1. - t) * .12 * (1. - uNight * .6);`}
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`;
  const waterMat = new THREE.ShaderMaterial({ uniforms: waterU, vertexShader: waterVS, fragmentShader: waterFS(false), fog: true });
  const water = new THREE.Mesh(new THREE.CircleGeometry(160, 64).rotateX(-Math.PI / 2), waterMat);
  water.position.set(center.x, WATER_Y, center.z);
  water.receiveShadow = false;
  scene.add(water);
  const wallMat = new THREE.ShaderMaterial({ uniforms: waterU, vertexShader: waterVS, fragmentShader: waterFS(true), fog: true });

  // ───────────────────────── 程序貼圖 ─────────────────────────
  function canvasTex(size, draw, repeat = true) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const g = cv.getContext('2d');
    draw(g, size);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  }
  const texRand = mulberry32(77);
  const groundTex = {
    brick: canvasTex(256, (g, s) => {
      g.fillStyle = '#fbf6ef'; g.fillRect(0, 0, s, s);
      const bh = 16, bw = 32;
      for (let y = 0; y < s; y += bh) {
        const off = (y / bh) % 2 ? bw / 2 : 0;
        for (let x = -bw; x < s + bw; x += bw) {
          const v = 236 + texRand() * 14 | 0;
          g.fillStyle = `rgb(${v},${v - 6},${v - 14})`;
          g.fillRect(x + off + 1, y + 1, bw - 2, bh - 2);
        }
      }
    }),
    speckle: canvasTex(256, (g, s) => {
      g.fillStyle = '#f7f6ef'; g.fillRect(0, 0, s, s);
      for (let i = 0; i < 900; i++) {
        const v = 215 + texRand() * 35 | 0;
        g.fillStyle = `rgba(${v - 20},${v},${v - 30},.55)`;
        g.beginPath(); g.arc(texRand() * s, texRand() * s, 1 + texRand() * 3, 0, 7); g.fill();
      }
    }),
    stripe: canvasTex(256, (g, s) => {
      g.fillStyle = '#fbf7f1'; g.fillRect(0, 0, s, s);
      g.fillStyle = 'rgba(200,185,165,.22)';
      for (let i = -s; i < s * 2; i += 22) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 10, 0); g.lineTo(i + 10 - s, s); g.lineTo(i - s, s); g.fill(); }
      for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(180,160,140,.12)'; g.fillRect(texRand() * s, texRand() * s, 2, 2); }
    })
  };
  function bandTex(color) {
    return canvasTex(256, (g, s) => {
      g.fillStyle = color; g.fillRect(0, 0, s, s);
      g.fillStyle = 'rgba(255,248,244,.85)';
      const n = 8, w = s / n;
      for (let i = 0; i < n; i++) { g.beginPath(); g.moveTo(i * w, s * .78); g.lineTo(i * w + w / 2, s * .3); g.lineTo(i * w + w, s * .78); g.closePath(); g.fill(); }
      g.fillStyle = 'rgba(33,29,29,.18)'; g.fillRect(0, 0, s, s * .08);
      g.fillStyle = 'rgba(255,248,244,.6)'; for (let i = 0; i < n; i++) { g.beginPath(); g.arc(i * w + w / 2, s * .9, 4, 0, 7); g.fill(); }
    });
  }

  // ───────────────────────── 六角形幾何 ─────────────────────────
  // pointy-top：頂點角度 30°+k·60°（含 90° → +z）
  const hexV = (r, k) => { const a = Math.PI / 6 + k * Math.PI / 3; return [r * Math.cos(a), r * Math.sin(a)]; };
  function hexRing(rIn, rOut) {
    const pos = [], idx = [];
    for (let k = 0; k < 6; k++) {
      const [ix, iz] = hexV(rIn, k), [ox, oz] = hexV(rOut, k);
      pos.push(ix, 0, iz, ox, 0, oz);
    }
    for (let k = 0; k < 6; k++) {
      const a = k * 2, b = ((k + 1) % 6) * 2;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    // 法線朝上
    const n = g.attributes.normal; for (let i = 0; i < n.count; i++) n.setXYZ(i, 0, 1, 0);
    const uv = []; for (let i = 0; i < pos.length; i += 3) uv.push(pos[i] / 2.2, pos[i + 2] / 2.2);
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    return g;
  }
  // 開口六角柱側壁：從 y0 到 y1
  function hexWall(r, y0, y1, uRepeat = 6) {
    const g = new THREE.CylinderGeometry(r, r, y1 - y0, 6, 1, true);
    g.translate(0, (y0 + y1) / 2, 0);
    const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * uRepeat);
    return g;
  }

  // ───────────────────────── 島 ─────────────────────────
  const islandGroup = new THREE.Group();
  scene.add(islandGroup);
  const pickables = [];
  const groundMats = {};
  const curbMat = new THREE.MeshStandardMaterial({ color: C.curb, roughness: .9, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const pathMat = new THREE.MeshStandardMaterial({ color: C.path, roughness: .95, map: groundTex.brick, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  const shallowMat = new THREE.MeshBasicMaterial({ color: '#c4e6e6', transparent: true, opacity: .45, depthWrite: false, fog: true });
  const foamMat = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .55, depthWrite: false, fog: true });
  const curbTopG = hexRing(R - 0.11, R + 0.005);
  const pathG = hexRing(PATH_R - 0.14, PATH_R + 0.14);
  const shallowG = hexRing(R, R + 0.7);
  const foamG = hexRing(R, R + 0.16);
  const bandG = hexWall(R + 0.005, TOP - 0.16, TOP + 0.03, 6);
  const wallG = hexWall(R, WATER_Y - 0.8, TOP - 0.16, 1);

  islands.forEach((s) => {
    const { d, c } = s;
    const g = new THREE.Group();
    g.position.set(c.x, 0, c.z);
    g.userData.island = s;
    s.group = g;

    // 島面：UV 用世界座標 ÷2.2，花紋跨島連續
    const topG = new THREE.CircleGeometry(R - 0.05, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2);
    const p = topG.attributes.position, uv = topG.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + c.x) / 2.2, (p.getZ(i) + c.z) / 2.2);
    const key = d.ground + d.tint;
    const mat = groundMats[key] || (groundMats[key] = new THREE.MeshStandardMaterial({ color: d.tint, map: groundTex[d.ground], roughness: .92 }));
    const top = new THREE.Mesh(topG, mat);
    top.position.y = TOP;
    top.receiveShadow = true;
    top.userData.island = s;
    s.top = top;
    pickables.push(top);

    const path = new THREE.Mesh(pathG, pathMat); path.position.y = TOP + 0.004; path.receiveShadow = true;
    const curb = new THREE.Mesh(curbTopG, curbMat); curb.position.y = TOP + 0.03; curb.receiveShadow = true;
    const band = new THREE.Mesh(bandG, new THREE.MeshStandardMaterial({ color: '#ffffff', map: bandTex(d.band), roughness: .85 }));
    band.castShadow = true;
    const wall = new THREE.Mesh(wallG, wallMat);
    const shallow = new THREE.Mesh(shallowG, shallowMat); shallow.position.y = WATER_Y + 0.006; shallow.renderOrder = 1;
    const foam = new THREE.Mesh(foamG, foamMat); foam.position.y = WATER_Y + 0.012; foam.renderOrder = 2;
    [path, curb, band, wall].forEach((m) => { m.userData.island = s; pickables.push(m); });
    g.add(top, path, curb, band, wall, shallow, foam);
    islandGroup.add(g);

    // 標籤：前側崖邊
    const el = document.createElement('div');
    el.className = 'isl-label';
    el.innerHTML = `<b>${d.no}</b><span class="nm">${tr(d.name, d.en)}</span>${DATA.videos.some((v) => v.islands.includes(d.id)) ? '<i class="vid" title="有影音紀錄">▶</i>' : ''}`;
    el.addEventListener('click', (e) => { e.stopPropagation(); onIslandLabel(s); });
    const lab = new CSS2DObject(el);
    lab.position.set(0, TOP - 0.02, R * 0.93);
    g.add(lab);
    s.label = el;
  });

  // ───────────────────────── 橋 ─────────────────────────
  const NB = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
  const keyQR = (q, r) => q + ',' + r;
  const qrMap = Object.fromEntries(islands.map((s) => [keyQR(s.d.q, s.d.r), s]));
  const bridges = [];
  islands.forEach((s) => {
    NB.forEach(([dq, dr]) => {
      const n = qrMap[keyQR(s.d.q + dq, s.d.r + dr)];
      if (n && n.i > s.i) bridges.push([s, n]);
    });
  });
  const EDGE_MID = PATH_R * Math.cos(Math.PI / 6);
  const plankG = new THREE.BoxGeometry(1, 1, 1);
  const PLANKS = 9;
  const plankMesh = new THREE.InstancedMesh(plankG, new THREE.MeshStandardMaterial({ color: C.wood, roughness: .8 }), bridges.length * PLANKS);
  const railMesh = new THREE.InstancedMesh(plankG, new THREE.MeshStandardMaterial({ color: C.cream, roughness: .8 }), bridges.length * 2 * 3);
  plankMesh.castShadow = plankMesh.receiveShadow = true;
  railMesh.castShadow = true;
  const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), sc = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  let pi = 0, ri = 0;
  bridges.forEach(([a, b], bi) => {
    const dir = v1.subVectors(b.c, a.c).setY(0).normalize().clone();
    const p0 = a.c.clone().addScaledVector(dir, EDGE_MID - 0.12);
    const p1 = b.c.clone().addScaledVector(dir, -(EDGE_MID - 0.12));
    const L = p0.distanceTo(p1);
    const H = rr(0.04, 0.1);
    bridges[bi].H = H;
    const yaw = Math.atan2(dir.x, dir.z);
    const side = new THREE.Vector3(dir.z, 0, -dir.x);
    const jit = () => 1 + (rand() - .5) * 0.0144;
    for (let k = 0; k < PLANKS; k++) {
      const t = (k + .5) / PLANKS;
      const y = TOP + 0.03 + Math.sin(t * Math.PI) * H;
      const slope = Math.cos(t * Math.PI) * Math.PI * H / L;
      q4.setFromEuler(new THREE.Euler(-Math.atan(slope), yaw, 0, 'YXZ'));
      v2.copy(p0).lerp(p1, t).setY(y);
      m4.compose(v2, q4, sc.set(0.4 * jit(), 0.05 * jit(), (L / PLANKS) * 0.92 * jit()));
      plankMesh.setMatrixAt(pi++, m4);
    }
    // 欄杆柱：兩側三支
    for (const sd of [-1, 1]) for (const t of [0.08, 0.5, 0.92]) {
      const y = TOP + 0.03 + Math.sin(t * Math.PI) * H + 0.07;
      v2.copy(p0).lerp(p1, t).setY(y).addScaledVector(side, sd * 0.19);
      m4.compose(v2, q4.identity(), sc.set(0.035, 0.12, 0.035));
      railMesh.setMatrixAt(ri++, m4);
    }
  });
  scene.add(plankMesh, railMesh);

  // ───────────────────────── 日夜 ─────────────────────────
  const KF = [
    [0, '1e2c58', '3f4f80', 'b4c2ff', 1.15, '94a2d8', '64566a', 1.85, 1, '5a88b2'],
    [300, '26365f', '4c5688', 'b8c4ff', 1.0, '96a4da', '66586c', 1.85, 1, '5c8ab4'],
    [360, '7f8fc4', 'f6c3a6', 'ffb48a', 1.3, 'f3c6b5', '6b5a5a', 1.1, .55, '8fb7c4'],
    [450, 'a9d1ea', 'fbe6d3', 'ffe2c4', 2.4, 'eaf2f6', '8a7a68', 1.25, 0, '9fcfd6'],
    [720, '9fd0ec', 'f4eee3', 'fff1de', 2.9, 'eef6fa', '8f8270', 1.35, 0, 'a9d8db'],
    [960, 'a6cfe6', 'f8e7d2', 'ffe3c0', 2.5, 'f1efe8', '8a7a66', 1.25, 0, '9fcbd2'],
    [1065, '8b8fc4', 'f7b98f', 'ff9f6a', 1.8, 'f6d2bc', '7d6660', 1.2, .3, '93a9bd'],
    [1140, '5a5e9e', 'd99aa6', 'ff9a7a', 1.3, 'c0b2e0', '655868', 1.35, .75, '6a7cab'],
    [1260, '22325f', '445488', 'c0ccff', 1.2, '98a8dc', '685a6e', 1.9, 1, '5a88b2'],
    [1440, '1e2c58', '3f4f80', 'b4c2ff', 1.15, '94a2d8', '64566a', 1.85, 1, '5a88b2']
  ].map((k) => ({ m: k[0], top: new THREE.Color('#' + k[1]), hor: new THREE.Color('#' + k[2]), sun: new THREE.Color('#' + k[3]), sunI: k[4], hs: new THREE.Color('#' + k[5]), hg: new THREE.Color('#' + k[6]), hI: k[7], night: k[8], water: new THREE.Color('#' + k[9]) }));
  const NOON_SHALLOW = new THREE.Color('#a4d4da'), NOON_DEEP = new THREE.Color('#6fa9b8'), NOON_WATER = new THREE.Color('#a9d8db');
  const deepRatio = new THREE.Color(NOON_DEEP.r / NOON_WATER.r, NOON_DEEP.g / NOON_WATER.g, NOON_DEEP.b / NOON_WATER.b);
  const shallowRatio = new THREE.Color(NOON_SHALLOW.r / NOON_WATER.r, NOON_SHALLOW.g / NOON_WATER.g, NOON_SHALLOW.b / NOON_WATER.b);
  const world = { night: 0, minutes: 600 };
  const tmpC = new THREE.Color();
  function applyTime(min) {
    min = ((min % 1440) + 1440) % 1440;
    let i = 0; while (i < KF.length - 2 && KF[i + 1].m <= min) i++;
    const a = KF[i], b = KF[i + 1], t = (min - a.m) / (b.m - a.m);
    skyU.uTop.value.lerpColors(a.top, b.top, t);
    skyU.uHorizon.value.lerpColors(a.hor, b.hor, t);
    scene.fog.color.copy(skyU.uHorizon.value);
    sun.color.lerpColors(a.sun, b.sun, t);
    sun.intensity = THREE.MathUtils.lerp(a.sunI, b.sunI, t);
    skyU.uSun.value.copy(sun.color);
    hemi.color.lerpColors(a.hs, b.hs, t);
    hemi.groundColor.lerpColors(a.hg, b.hg, t);
    hemi.intensity = THREE.MathUtils.lerp(a.hI, b.hI, t);
    world.night = THREE.MathUtils.lerp(a.night, b.night, t);
    skyU.uNight.value = waterU.uNight.value = world.night;
    tmpC.lerpColors(a.water, b.water, t);
    waterU.uShallow.value.setRGB(tmpC.r * shallowRatio.r, tmpC.g * shallowRatio.g, tmpC.b * shallowRatio.b);
    waterU.uDeep.value.setRGB(tmpC.r * deepRatio.r, tmpC.g * deepRatio.g, tmpC.b * deepRatio.b);
    shallowMat.color.copy(tmpC).lerp(new THREE.Color('#ffffff'), .35 - world.night * .2);
    foamMat.opacity = .55 * (1 - world.night * .45);
    // 太陽方位（量化到 10 分鐘）
    const qm = Math.round(min / 10) * 10;
    const st = THREE.MathUtils.clamp((qm - 360) / 720, 0, 1);
    const az = Math.PI * (0.15 + 0.7 * st);
    const el = 0.35 + Math.sin(st * Math.PI) * 0.75;
    const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), 0.55 * Math.cos(el) + 0.35).normalize();
    sun.position.copy(center).addScaledVector(dir, 40);
    skyU.uSunDir.value.copy(dir);
    onTimeApplied.forEach((f) => f(min, world.night));
    dirty = true;
  }
  const onTimeApplied = [];

  // ───────────────────────── 零件庫（kit） ─────────────────────────
  // 建模函式只推 {kind, matrix, color}；最後每種 kind 建一個 InstancedMesh。

  function refreshPins() {

  // ── 島標籤狀態 ──
  function refreshLabels() {
    const sel = UI.sel;

  // ───────────────────────── 相機飛行 ─────────────────────────
  const ISL_OFF = new THREE.Vector3(2.75, 5.3, 6.2), BLD_OFF = new THREE.Vector3(1.6, 2.5, 3.2), BIRD_OFF = new THREE.Vector3(0.01, 42, 6);
  let fly = null;
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function flyTo(subject, offset, opts = {}) {
    const cardShown = !$('#card').hidden;
    const shift = isDesk() && cardShown && !opts.noShift ? 1.5 : 0;
    const off = UI.bird ? BIRD_OFF : offset;
    const f = new THREE.Vector3(-off.x, 0, -off.z).normalize();
    const right = new THREE.Vector3(-f.z, 0, f.x);
    const tt = subject.clone().addScaledVector(right, -shift);
    const tp = tt.clone().add(off);
    if (reduceMQ.matches) { controls.target.copy(tt); camera.position.copy(tp); controls.update(); fly = null; dirty = true; return; }
    fly = { t0: performance.now(), ft: controls.target.clone(), fp: camera.position.clone(), tt, tp };
  }
  onFrame.push(() => {
    if (!fly) return;
    const t = Math.min(1, (performance.now() - fly.t0) / 800), e = ease(t);
    controls.target.lerpVectors(fly.ft, fly.tt, e);
    camera.position.lerpVectors(fly.fp, fly.tp, e);
    if (t >= 1) fly = null;
    dirty = true;
  });
  function flyOverview() {
    const tt = overviewTarget(), tp = tt.clone().addScaledVector(overviewDir(), overviewDistance());
    if (UI.bird) tp.copy(tt).add(BIRD_OFF);

    fly = { t0: performance.now(), ft: controls.target.clone(), fp: camera.position.clone(), tt, tp };
  }

  // ───────────────────────── 選取 ─────────────────────────

    else if (sel.type === 'item') { const info = itemInfo[sel.id]; flyTo(info.pos.clone().setY((TOP + info.top) / 2), BLD_OFF.clone().multiplyScalar(Math.max(.8, info.scale * 1.15))); }
    else if (sel.type === 'flow') { const f = flowById[sel.id]; const mid = byId[f.from].c.clone().add(byId[f.to].c).multiplyScalar(.5).setY(TOP); flyTo(mid, ISL_OFF.clone().multiplyScalar(1 + byId[f.from].c.distanceTo(byId[f.to].c) / 9)); }
    else if (sel.type === 'walker' && sel.pos) flyTo(sel.pos.clone(), BLD_OFF);
  }

  // ── 點擊 raycast ──
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let down = null;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; fly = null; });
  cv.addEventListener('pointerup', (e) => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]);
    down = null;
    if (moved > 6) return;
    const r = cv.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    for (const p of pickers) if (p(ray)) return;
    const targets = [...kitGroup.children, ...(smallGroup.visible ? smallGroup.children : []), ...pickables];
    const hit = ray.intersectObjects(targets, false)[0];
    if (!hit) { if (UI.sel) clearSelection(); return; }
    if (hit.object.isInstancedMesh && hit.instanceId != null) {
      const part = hit.object.userData.parts[hit.instanceId];
      if (part && part.owner) { selectItem(part.owner); return; }
    }
    if (hit.object.userData.island) { selectIsland(hit.object.userData.island); return; }
    // 樹、路燈等：找最近的島
    let best = null, bd = 1e9;
    islands.forEach((s) => { const d = Math.hypot(hit.point.x - s.c.x, hit.point.z - s.c.z); if (d < bd) { bd = d; best = s; } });
    if (best && bd < R + .2) selectIsland(best); else if (UI.sel) clearSelection();
  });

  // ───────────────────────── 卡片 ─────────────────────────
  const cardEl = $('#card'), cardBody = $('#cardBody');
  const src = `<a class="src" href="${DATA.city.source}" target="_blank" rel="noopener">${tr('政見原文：542upup.tw ↗', 'Source: 542upup.tw ↗')}</a>`;
  const flowChip = (f) => `<button class="chip btnlike" data-flow="${f.id}">${esc(tr(byId[f.from].d.name, byId[f.from].d.en))} → ${esc(tr(byId[f.to].d.name, byId[f.to].d.en))}・${esc(tr(f.carryName, f.carryEn))}</button>`;
  function extractStats(text) {
    const out = [];
    const re = /(\d+(?:\.\d+)?)\s*到\s*(\d+)\s*(歲)|(\d+\.\d+)|(\d+(?:\.\d+)?)\s*(%|萬|億|座|處|歲|年)/g;
    let m;
    while ((m = re.exec(text)) && out.length < 3) {
      if (m[1]) out.push({ v: `${m[1]}–${m[2]}`, u: m[3] });
      else if (m[4]) out.push({ v: m[4], u: text.slice(Math.max(0, m.index - 4), m.index).trim() });
      else out.push({ v: m[5], u: m[6] });

  // 160² 離屏縮圖：在主 canvas 角落畫一次再拷貝
  const thumbCam = new THREE.PerspectiveCamera(30, 1, .05, 120);
  function renderThumb(canvas, id) {
    const info = itemInfo[id];

    const c = info.pos.clone().setY(TOP + (info.top - TOP) * .45);

  function buildList() {

  // ───────────────────────── 草鞋船環島航行 ─────────────────────────
  // 白天沿環城航道繞行，停靠各島碼頭上下客；19:30 後回到安心行路前的港灣過夜，06:00 再啟航
  const BAY = boatHome.clone().setY(0);
  // 環城航道：每個方位找出最外側的島，再往外留 1.4 的水道
  const ring = (() => {
    const N = 96, rs = [];

        const along = ox * dx + oz * dz, perp = Math.abs(ox * dz - oz * dx), cl = R + 1.5;

  })();

  const docks = [];
  islands.forEach((s) => {

    if (gap < 2.4) docks.push({ s, u, p, gap });

  // 簡單的小人（船長、乘客）

  const candWrap = document.createElement('div');
  candWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center';
  candWrap.append(candGreet, candEl, candAct);
  const candLabel = new CSS2DObject(candWrap);
  candLabel.center.set(.5, 1);
  scene.add(candLabel);

  // 行程：每座島挑一個細項，依相鄰順序繞城一圈
  const ACTION = { hall: ['傾聽鄉親需求', 'Listening to residents'], phone: ['測試草屯人 APP', 'Testing the Caotun app'], map: ['盤點地圖', 'Reviewing the map'], river: ['檢查排水', 'Checking drainage'], farm: ['拜訪農友', 'Visiting farmers'], classroom: ['陪孩子讀書', 'Reading with kids'], busstop: ['搭幸福巴士', 'Riding the bus'], playground: ['檢查共融遊具', 'Checking play equipment'], roadwork: ['道路總體檢', 'Auditing roads'], crossing: ['改善路口', 'Fixing a crossing'], market: ['逛市場聽攤商', 'Talking to vendors'], kiosk: ['和攤商聊天', 'Chatting with stall owners'] };
  const tourIslands = (() => {
    const order = [byId.I04], left = new Set(islands.filter((s) => s !== byId.I04));
    while (left.size) {
      const last = order[order.length - 1];
      let best = null, bd = 1e9;
      left.forEach((s) => { const d = s.c.distanceTo(last.c); if (d < bd) { bd = d; best = s; } });
      order.push(best); left.delete(best);
    }
    return order;
  })();
  const tRand = mulberry32(1128);
  const nextStop = (() => { let k = 0; return () => { const s = tourIslands[k++ % tourIslands.length]; const it = s.order[(tRand() * s.order.length) | 0]; return { s, it }; }; })();
  function routeNodes(a, b) {
    const dist = new Array(nodes.length).fill(Infinity), prev = new Array(nodes.length).fill(-1), done = new Array(nodes.length).fill(false);
    dist[a] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < nodes.length; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u < 0) return [a];
      if (u === b) { const p = []; for (let x = u; x >= 0; x = prev[x]) p.unshift(x); return p; }
      done[u] = true;
      for (const [v, w] of adj[u]) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
    }
  }
  const C_ = { node: byId.I04.nodes[1], leg: null, d: 0, wait: 0, stop: null, phase: 'walk', pos: new THREE.Vector3(), fwd: new THREE.Vector3(0, 0, 1), t: 0 };
  function planLeg() {
    const stop = nextStop();
    const info = itemInfo[stop.it.id];
    let near = stop.s.nodes[0], nd = 1e9;
    stop.s.nodes.forEach((n) => { const d = nodes[n].p.distanceTo(info.pos); if (d < nd) { nd = d; near = n; } });
    const pl = polyline(routeNodes(C_.node, near));
    // 從步道走到建物前
    const standDir = nodes[near].p.clone().sub(info.pos).setY(0).normalize();
    const stand = info.pos.clone().addScaledVector(standDir, Math.max(.28, info.scale * .55)).setY(NODE_Y);
    pl.pts.push(stand);
    pl.cum.push(pl.len + stand.distanceTo(pl.pts[pl.pts.length - 2]));
    pl.len = pl.cum[pl.cum.length - 1];
    C_.leg = pl; C_.d = 0; C_.stop = stop; C_.node = near; C_.phase = 'walk';
  }
  planLeg();
  const candWho = () => tr(DATA.city.candidate, DATA.city.candidateEn);
  function candLog(stop) {
    const act = ACTION[stop.it.model] || ['推動政見', 'Working on policy'];
    LOG.unshift({ t: fmt(world.minutes), kind: 'visit', flow: 'cand', text: tr(`${candWho()}在${stop.s.d.name}${act[0]}：${stop.it.name}`, `${candWho()} at ${stop.s.d.en}: ${act[1]} (${stop.it.en})`) });
    if (LOG.length > 80) LOG.pop();
    if (UI.log) renderLog();
  }
  let follow = false;
  const greet = { t: 0, dir: new THREE.Vector3() };
  const GREET = {
    elder: ['阿伯、阿姨好！', 'Good day, auntie!'], student: ['小朋友好！', 'Hi there, kiddo!'], farmer: ['辛苦了！', 'Thanks for your hard work!'],
    worker: ['辛苦了！', 'Thanks for your hard work!'], parent: ['寶寶好可愛！', 'What a cute baby!'], tourist: ['歡迎來草屯！', 'Welcome to Caotun!'],
    official: ['一起加油！', "Let's keep going!"], commuter: ['路上小心！', 'Ride safe!'], researcher: ['你好！', 'Hello!']
  };
  const _prevT = new THREE.Vector3();
  onFrame.push((dt, animate) => {
    if (animate) {
      C_.t += dt;
      if (C_.phase === 'walk') {
        C_.d += .36 * dt;
        if (C_.d >= C_.leg.len) {
          C_.d = C_.leg.len; C_.phase = 'visit'; C_.wait = 4.5;
          UI.candVisit = C_.stop.it.id; refreshColors();
          const act = ACTION[C_.stop.it.model] || ['推動政見', 'Working on policy'];
          candAct.textContent = tr(act[0], act[1]) + '…';
          candAct.hidden = false;
          candLog(C_.stop);
        }
      } else {
        C_.wait -= dt;
        if (C_.wait <= 0) {
          UI.candVisit = null; refreshColors();
          candAct.hidden = true;
          // 回到步道再出發
          const back = polyline([C_.node]);
          const stand = C_.leg.pts[C_.leg.pts.length - 1];
          planLeg();
          C_.leg.pts.unshift(stand); C_.leg.cum = [0, ...C_.leg.cum.map((c) => c + stand.distanceTo(C_.leg.pts[1]))]; C_.leg.len = C_.leg.cum[C_.leg.cum.length - 1];
          void back;
        }
      }
    }
    sampleAt(C_.leg, C_.d, C_.pos, C_.fwd);
    const moving = C_.phase === 'walk';
    if (!moving) C_.fwd.copy(itemInfo[C_.stop.it.id].pos).sub(C_.pos).setY(0).normalize();
    const camDist = camera.position.distanceTo(controls.target);
    const sc = 1.25 * THREE.MathUtils.clamp(camDist / 20, 1, 1.45);
    const ph = C_.t * 9;
    const sw = moving ? Math.sin(ph) : 0;
    cand.position.set(C_.pos.x, C_.pos.y + (moving ? Math.abs(Math.sin(ph)) * .012 : 0), C_.pos.z);
    if (C_.fwd.lengthSq() > .01) cand.rotation.y = Math.atan2(C_.fwd.x, C_.fwd.z);
    cand.scale.setScalar(sc);
    // 對遇到的每位鎮民問好
    if (animate) {
      if (greet.t > 0) { greet.t -= dt; if (greet.t <= 0) candGreet.hidden = true; }
      else if (UI.carry) {
        for (const w of walkers) {
          if ((w.greetCool || 0) > C_.t) continue;
          const dx = w.pos.x - C_.pos.x, dz = w.pos.z - C_.pos.z;
          if (dx * dx + dz * dz < .5 * .5) {
            w.greetCool = C_.t + 25;
            greet.t = 1.8; greet.dir.set(dx, 0, dz).normalize();
            const g = GREET[w.role] || GREET.researcher;
            candGreet.textContent = tr(g[0], g[1]);
            candGreet.hidden = false;
            break;
          }
        }
      }
    }
    const greeting = greet.t > 0;
    if (greeting && !moving) cand.rotation.y = Math.atan2(greet.dir.x, greet.dir.z);
    cParts.legL.rotation.x = sw * .55; cParts.legR.rotation.x = -sw * .55;
    cParts.armL.rotation.x = -sw * .45;
    if (greeting) { cParts.armR.rotation.x = -2.7; cParts.armR.rotation.z = Math.sin(C_.t * 14) * .35; }
    else { cParts.armR.rotation.z = 0; cParts.armR.rotation.x = moving ? sw * .45 : -.9 + Math.sin(C_.t * 3) * .15; }
    candLabel.position.set(C_.pos.x, C_.pos.y + .4 * sc, C_.pos.z);
    if (follow) {
      _prevT.copy(controls.target);
      controls.target.lerp(cand.position, .08);
      camera.position.add(_prevT.sub(controls.target).negate());
    }
    dirty = true;
  });
  // 點她 → 候選人卡片
  function candCard() {
    const c = DATA.city;
    const now = C_.phase === 'visit' ? `${tr((ACTION[C_.stop.it.model] || ['推動政見'])[0], (ACTION[C_.stop.it.model] || [, 'Working on policy'])[1])}：${tr(C_.stop.it.name, C_.stop.it.en)}` : tr(`正在前往 ${C_.stop.s.d.name}`, `Heading to ${C_.stop.s.d.en}`);
    return `<div class="card-top"><img class="cand-photo" src="${c.images.hero}" alt="" onerror="this.remove()">
      <div><div class="eyebrow">${esc(tr(c.role, c.roleEn))}</div><h2>${esc(tr(c.candidate, c.candidateEn))}</h2></div></div>
      <p class="lead">${esc(tr(c.slogan, c.sloganEn))}</p>
      <h3>${tr('現在', 'Right now')}</h3><div class="chips"><button class="chip btnlike" data-item="${C_.stop.it.id}">${esc(now)}</button></div>
      <h3>${tr('行程', 'Route')}</h3><p class="lead">${tr('她會走遍十二座政策島，在政見地點停下來傾聽鄉親、推動市政。', 'She walks all twelve policy islands and stops at each policy site to listen and get work done.')}</p>
      <div class="chips"><button class="chip btnlike" id="candFollow">${follow ? tr('停止跟隨', 'Stop following') : tr('跟著她走', 'Follow her')}</button></div>
      ${vidList(DATA.videos.filter((v) => !v.islands.length || v.kind !== 'trail'))}
      ${src}`;
  }
  function selectCandidate() {
    select({ type: 'walker', pos: cand.position.clone(), html: candCard() });
  }
  candEl.addEventListener('click', (e) => { e.stopPropagation(); selectCandidate(); });
  pickers.unshift((ray) => {
    if (!ray.intersectObject(cand, true).length) return false;
    selectCandidate();
    return true;
  });
  cardBody.addEventListener('click', (e) => {
    if (!e.target.closest('#candFollow')) return;
    follow = !follow;
    if (follow) { fly = null; controls.minDistance = 3; }
    e.target.textContent = follow ? tr('停止跟隨', 'Stop following') : tr('跟著她走', 'Follow her');
  });
  cv.addEventListener('pointerdown', () => { /* 拖曳時仍跟隨，只取消飛行 */ });
  onSelect.push((sel) => { if (!sel || sel.type !== 'walker' || sel.flow) follow = follow && sel && sel.type === 'walker' && !sel.flow; });


  // ───────────────────────── 尺寸 ─────────────────────────
  function resize() {
    const w = stageEl.clientWidth || innerWidth, h = stageEl.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    labelRenderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    dirty = true;
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();
  overview();
  setTime(600);

  // ───────────────────────── 迴圈 ─────────────────────────
  controls.addEventListener('change', () => { dirty = true; });
  const clock = new THREE.Clock();
  let elapsed = 0;
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.08);
    const animate = !reduceMQ.matches && !paused;
    if (animate) {
      elapsed += dt;
      waterU.uTime.value = elapsed;
      dirty = true;
      {
        world.minutes = (world.minutes + dt * 10) % 1440;
        const tenth = Math.floor(world.minutes);
        if (tenth !== lastMinuteShown) { applyTime(world.minutes); }
      }
    }
    const shown = Math.floor(world.minutes);
    if (shown !== lastMinuteShown) { clockEl.textContent = fmt(shown); lastMinuteShown = shown; }
    onFrame.forEach((f) => f(dt, animate));
    controls.update();
    if (!dirty) return;
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    afterRender.forEach((f) => f());
    dirty = false;
  }
  frame();
  reduceMQ.addEventListener?.('change', () => { dirty = true; });

  requestAnimationFrame(() => $('#loading').classList.add('done'));
  window.__city = { scene, camera, controls, renderer, setTime, islands };
}

</script>
