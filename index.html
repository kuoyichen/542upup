<style>
/* 版面：滿版 3D 舞台，介面元件浮在四角。單一暖色黏土世界，不做深色主題。 */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --glass:#86a8a6; --wood:#b48560; --teal:#3e7c8c;
  --paper:rgba(255,250,245,.78); --line:rgba(33,29,29,.10);
  --shadow:0 1px 2px #4a2a1410,0 6px 18px #4a2a1414,0 18px 48px #4a2a1412;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-num:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
.eyebrow{font:700 10px/1.2 var(--f-mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
.btn{min-height:44px;border-radius:9px;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--f-ui);cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"],.btn:active{background:var(--ink);color:var(--cream)}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;box-shadow:0 2px 8px #4a2a1414;padding:6px 12px;font-size:12px;border:0;color:var(--ink)}

/* island label pill */
.isl-label{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;background:rgba(255,248,244,.94);box-shadow:0 2px 8px #4a2a1420;font:600 13px/1 var(--f-ui);white-space:nowrap;transition:opacity .25s,background .2s,color .2s;user-select:none}
.isl-label b{font:700 10px/1 var(--f-mono);letter-spacing:1px;color:#fff;background:var(--coral);border-radius:999px;padding:4px 6px}
.isl-label.sel{background:var(--ink);color:var(--cream)}
.isl-label.dim{opacity:.45}

/* loading */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading .in{text-align:center;padding:0 24px}
#loading h1{margin:10px 0 6px;font-size:clamp(34px,7vw,64px);letter-spacing:4px;font-weight:900}
#loading p{margin:0;color:#6b5a50;font-size:15px}
#loading .err{margin-top:18px;color:#a3301a;font-size:14px;max-width:420px;line-height:1.6;white-space:pre-wrap}
.dots i{display:inline-block;width:8px;height:8px;margin:18px 4px 0;border-radius:50%;background:var(--coral);animation:bob 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--yellow)}.dots i:nth-child(3){animation-delay:.3s;background:var(--teal)}
@keyframes bob{50%{transform:translateY(-8px)}}

/* brand */
#brand{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
#brand .photo{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--stone)}
#brand h1{margin:2px 0 0;font-size:20px;font-weight:900;letter-spacing:1px}
#brand h1 span{color:var(--coral)}
#brand .sub{font-size:12px;color:#6b5a50;margin-top:2px}

/* clock (stage 1 HUD) */
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--paper);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
#hud .time{font:italic 22px/1 var(--f-num);padding:0 12px 0 14px;min-width:70px;text-align:center}
#hud .btn{border-radius:999px;min-width:44px}
</style>

<script type="module">
// ───────────────────────── 基本工具 ─────────────────────────
const $ = (s) => document.querySelector(s);
const LANG = (() => { try { return new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } })();
const tr = (zh, en) => (LANG === 'en' && en ? en : zh);
const store = {
  get(k, d) { try { const v = localStorage.getItem('542upup:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('542upup:' + k, JSON.stringify(v)); } catch (e) { /* 私密模式 */ } }
};
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(5422026);
const rr = (a, b) => a + (b - a) * rand();

function fail(err) {
  console.error(err);
  $('#loadingDots').hidden = true;
  $('#loadingMsg').textContent = tr('城市組合失敗', 'Could not build the city');
  const box = $('#loadingErr');
  box.hidden = false;
  box.textContent = tr('可能是瀏覽器不支援 WebGL，或網路無法載入 Three.js。請重新整理，或改用最新版 Chrome／Safari。', 'Your browser may not support WebGL, or Three.js could not be downloaded. Reload, or try a recent Chrome or Safari.') + '\n\n' + (err && err.message ? err.message : String(err));
  $('#loading').classList.remove('done');
}

// ───────────────────────── 常數 ─────────────────────────
const R = 2.02, SPACING = 2.28, TOP = 0.65, WATER_Y = -0.18;
const SQ3 = Math.sqrt(3);
const PATH_R = 1.8;
const C = {
  coral: '#db6a41', ink: '#211d1d', cream: '#fff8f4', yellow: '#fcea8b', stone: '#c5b5a7', green: '#71806a',
  glass: '#86a8a6', wood: '#b48560', teal: '#3e7c8c', plant: ['#9cc27a', '#8db86f', '#728f5f'],
  pastel: ['#f2b5c6', '#58a6a6', '#6f7fb5'], curb: '#e4d6c3', path: '#e8cdb0', glow: '#ffc777'
};
const isMobile = matchMedia('(max-width: 800px)').matches;
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');

// ───────────────────────── 品牌卡 ─────────────────────────
(function brand() {
  const c = DATA.city;
  $('#brandEyebrow').textContent = tr(c.role, c.roleEn);
  $('#brandTitle').innerHTML = `${tr(c.candidate, c.candidateEn)} <span>${tr('政策島', 'Policy Islands')}</span>`;
  $('#brandSub').textContent = tr(c.slogan, c.sloganEn);
  const img = $('#brandPhoto');
  img.onload = () => { img.hidden = false; };
  img.onerror = () => { img.remove(); };
  img.src = c.images.hero;
  document.querySelectorAll('[data-en]').forEach((el) => { if (LANG === 'en') el.textContent = el.dataset.en; });
  document.title = tr(c.title, c.titleEn);
})();

let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, BufferGeometryUtils, SimplexNoise;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js'));
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  BufferGeometryUtils = await import('three/addons/utils/BufferGeometryUtils.js');
  ({ SimplexNoise } = await import('three/addons/math/SimplexNoise.js'));
  init();
} catch (err) {
  fail(err);
}

function init() {
  let dirty = true;
  const onFrame = [];
  // ───────────────────────── Renderer ─────────────────────────
  const stageEl = $('#stage');
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('WebGL unavailable');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.4 : 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  stageEl.appendChild(renderer.domElement);
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('aria-label', tr('草屯鎮政策島 3D 城市', 'Caotun policy islands 3D city'));

  const labelRenderer = new CSS2DRenderer({ element: $('#labels') });

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.3, 320);

  // ───────────────────────── 島嶼座標 ─────────────────────────
  const axial = (q, r) => new THREE.Vector3(SQ3 * SPACING * (q + r / 2), 0, 1.5 * SPACING * r);
  const islands = DATA.islands.map((d, i) => ({ d, i, c: axial(d.q, d.r) }));
  const byId = Object.fromEntries(islands.map((s) => [s.d.id, s]));
  const center = new THREE.Vector3();
  islands.forEach((s) => center.add(s.c));
  center.divideScalar(islands.length);
  center.y = TOP;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = 3;
  controls.maxDistance = 70;

  const OVERVIEW_DIR = new THREE.Vector3(0.24, 0.33, 0.87).normalize();
  function overviewDistance() {
    const a = innerWidth / innerHeight;
    return a > 1.25 ? 28.5 : a > 0.8 ? 38 : 56;
  }
  function overview() {
    controls.target.copy(center);
    camera.position.copy(center).addScaledVector(OVERVIEW_DIR, overviewDistance());
    controls.update();
    dirty = true;
  }

  // ───────────────────────── 天空 ─────────────────────────
  const skyU = {
    uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSun: { value: new THREE.Color() }, uNight: { value: 0 }
  };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(170, 48, 24), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uTop,uHorizon,uSun,uSunDir; uniform float uNight; varying vec3 vDir;
      float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
      void main(){
        vec3 d = normalize(vDir);
        vec3 c = mix(uHorizon, uTop, smoothstep(-.02,.55,d.y));
        float s = max(dot(d, normalize(uSunDir)), 0.);
        c += uSun * pow(s, 18.) * .35;
        if (uNight > .01) {
          float n = h3(floor(d * 180.));
          if (n > .9965) c += vec3(.95,.95,1.) * uNight * smoothstep(.02,.25,d.y) * (.4 + (n-.9965)/.0035*.6);
        }
        gl_FragColor = vec4(c, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  scene.add(sky);

  // ───────────────────────── 光 ─────────────────────────
  const hemi = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.3);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1de, 2.8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 22, bottom: -22, near: 1, far: 90 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.045;
  sun.shadow.radius = 3;
  sun.target.position.copy(center);
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.copy(center).add(new THREE.Vector3(-20, 12, -14));
  fill.target.position.copy(center);
  scene.add(fill, fill.target);

  // ───────────────────────── 水 ─────────────────────────
  const waterU = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uShallow: { value: new THREE.Color('#a4d4da') }, uDeep: { value: new THREE.Color('#6fa9b8') },
    uTime: { value: 0 }, uCenter: { value: new THREE.Vector2(center.x, center.z) }, uNight: { value: 0 }
  }]);
  const waterVS = `#include <fog_pars_vertex>
    varying vec3 vW;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`;
  const waterFS = (wall) => `#include <fog_pars_fragment>
    uniform vec3 uShallow,uDeep; uniform float uTime,uNight; uniform vec2 uCenter; varying vec3 vW;

      if (i === 0) {
        P('cyl', '#ffffff', -.3, .1, .2, .3, 1.4, .3); P('cyl', C.coral, -.3, .5, .2, .31, .2, .31); P('cyl', C.coral, -.3, .95, .2, .31, .2, .31);
        P('glowsphere', '#fff1c0', -.3, 1.62, .2, .26, .26, .26); P('cone', C.coral, -.3, 1.72, .2, .36, .3, .36);
      } else { TREE.palm(); }
    });
  });
  const boats = [[-6, 12, .4], [11, -11, 2.2], [-17, -2, 1.2]];
  boats.forEach(([x, z, ry]) => withXf(xf(center.x + x, WATER_Y, center.z + z, .7, ry), () => {
    P('rbox', '#ffffff', 0, -.05, 0, .9, .2, .3); P('box', C.coral, 0, .1, 0, .92, .03, .32);
    P('cyl', C.wood, .05, .12, 0, .03, 1.0, .03);
    P('prism', '#fffaf0', .25, .2, 0, .02, .8, .42, Math.PI / 2);
  }));

  // ── 建立 InstancedMesh ──
  const kitMeshes = {};
  const ownerParts = {}; // owner → [{mesh, index, base}]
  const byKind = {};
  KIT.parts.forEach((p) => (byKind[p.kind] || (byKind[p.kind] = [])).push(p));
  const kitGroup = new THREE.Group();
  const smallGroup = new THREE.Group();
  scene.add(kitGroup, smallGroup);
  Object.entries(byKind).forEach(([kind, parts]) => {
    const base = kind.replace('~', '');
    const isGlow = base.startsWith('glow');
    const mesh = new THREE.InstancedMesh(GEO[base], isGlow ? glowMat : solidMat, parts.length);
    parts.forEach((p, i) => {
      mesh.setMatrixAt(i, p.m);
      mesh.setColorAt(i, p.color);
      if (p.owner) (ownerParts[p.owner] || (ownerParts[p.owner] = [])).push({ mesh, index: i, base: p.color });
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = !kind.includes('~') && !isGlow;
    mesh.receiveShadow = true;
    mesh.userData.parts = parts;
    mesh.computeBoundingSphere();
    (kind.includes('~') ? smallGroup : kitGroup).add(mesh);
    kitMeshes[kind] = mesh;
  });
  KIT.parts.length = 0;

  // 路燈光池（加法混合）
  const poolTex = canvasTex(128, (g, s) => {
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,210,140,1)'); gr.addColorStop(.5, 'rgba(255,190,110,.35)'); gr.addColorStop(1, 'rgba(255,180,100,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  }, false);
  const poolMat = new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0, fog: false });
  const pools = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.1, 1.1).rotateX(-Math.PI / 2), poolMat, lampSpots.length);
  lampSpots.forEach((p, i) => pools.setMatrixAt(i, _m.makeTranslation(p.x, p.y + .006, p.z)));
  pools.renderOrder = 3;
  scene.add(pools);
  onTimeApplied.push((min, night) => {
    glowMat.emissiveIntensity = night * 3.2;
    poolMat.opacity = night * .75;
    pools.visible = night > .02;
  });

  // ───────────────────────── 背景地形（盆地） ─────────────────────────
  const noiseRand = mulberry32(1207);
  const simplex = new SimplexNoise({ random: noiseRand });
  const fbm = (x, z) => { let a = 0, f = 1, amp = 1; for (let o = 0; o < 4; o++) { a += simplex.noise(x * f, z * f) * amp; f *= 2.03; amp *= .5; } return a; };
  const camSide = new THREE.Vector2(OVERVIEW_DIR.x, OVERVIEW_DIR.z).normalize();
  function terrainH(x, z) {
    const dx = x - center.x, dz = z - center.z, d = Math.hypot(dx, dz);
    const ring = THREE.MathUtils.smoothstep(d, 25, 50);
    let h = -2.2 + ring * 12 + fbm(x * .035, z * .035) * (1 + ring * 5) + Math.max(0, d - 50) * .12;
    h = ring > .05 ? Math.floor(h / .9) * .9 + (h % .9) * .25 : h;
    const facing = d > 0 ? (dx * camSide.x + dz * camSide.y) / d : 0;
    h *= 1 - .82 * THREE.MathUtils.smoothstep(facing, .15, .75) * THREE.MathUtils.smoothstep(d, 10, 30);
    if (d < 21) h = Math.min(h, -1.2 + THREE.MathUtils.smoothstep(d, 15, 21) * 1.1);
    return h;
  }
  const TCOL = [[-99, '#8fb3ad'], [.15, '#d9c9a3'], [.8, '#aec493'], [2.6, '#a3b986'], [5.5, '#6f8a62'], [10.5, '#b2a38d']].map(([h, c]) => [h, new THREE.Color(c)]);
  const terrainG = new THREE.PlaneGeometry(170, 170, isMobile ? 110 : 160, isMobile ? 110 : 160).rotateX(-Math.PI / 2).toNonIndexed();
  {
    const p = terrainG.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i) + center.x, p.getZ(i) + center.z));
    const col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i += 3) {
      const h = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
      let c = TCOL[0][1]; for (const [th, cc] of TCOL) if (h >= th) c = cc;
      for (let k = 0; k < 3; k++) { col[(i + k) * 3] = c.r; col[(i + k) * 3 + 1] = c.g; col[(i + k) * 3 + 2] = c.b; }
    }
    terrainG.setAttribute('color', new THREE.BufferAttribute(col, 3));
    terrainG.computeVertexNormals();
  }
  const terrain = new THREE.Mesh(terrainG, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .95 }));
  terrain.position.set(center.x, 0, center.z);
  terrain.receiveShadow = false;
  scene.add(terrain);

  // ── 背景樹 ──
  function mergeColored(parts) {
    const gs = parts.map(([g, col]) => {
      g = g.toNonIndexed ? (g.index ? g.toNonIndexed() : g) : g;
      const c = new THREE.Color(col), arr = new Float32Array(g.attributes.position.count * 3);
      for (let i = 0; i < arr.length; i += 3) { arr[i] = c.r; arr[i + 1] = c.g; arr[i + 2] = c.b; }
      g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
      g.deleteAttribute('uv');
      return g;
    });
    const m = BufferGeometryUtils.mergeGeometries(gs);
    m.computeVertexNormals();
    return m;
  }
  const trunkCol = '#6a5a4a';
  const coniferG = mergeColored([
    [new THREE.CylinderGeometry(.08, .1, .5, 5).translate(0, .25, 0), trunkCol],
    [new THREE.ConeGeometry(.6, .9, 7).translate(0, .75, 0), '#ffffff'],
    [new THREE.ConeGeometry(.45, .75, 7).translate(0, 1.15, 0), '#ffffff'],
    [new THREE.ConeGeometry(.3, .6, 7).translate(0, 1.5, 0), '#ffffff']
  ]);
  const leafRand = mulberry32(31);
  const broadG = mergeColored([
    [new THREE.CylinderGeometry(.08, .1, .55, 5).translate(0, .27, 0), trunkCol],
    ...[0, 1, 2, 3].map((i) => {
      const g = new THREE.IcosahedronGeometry(.42 + leafRand() * .12, 0);
      const p = g.attributes.position; for (let k = 0; k < p.count; k++) p.setXYZ(k, p.getX(k) * (1 + (leafRand() - .5) * .2), p.getY(k), p.getZ(k) * (1 + (leafRand() - .5) * .2));
      return [g.translate((leafRand() - .5) * .45, .8 + leafRand() * .4, (leafRand() - .5) * .45), '#ffffff'];
    })
  ]);
  const bgTreeMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .9 });
  const nBg = isMobile ? 1100 : 3200;
  const conifers = [], broads = [];
  const tr2 = mulberry32(99);
  for (let i = 0; i < nBg * 4 && conifers.length + broads.length < nBg; i++) {
    const a = tr2() * Math.PI * 2, d = 16 + Math.sqrt(tr2()) * 36;
    const x = center.x + Math.cos(a) * d, z = center.z + Math.sin(a) * d;
    const h = terrainH(x, z);
    if (h < .9) continue;
    const dens = simplex.noise(x * .08, z * .08);
    if (dens < -.25) continue;
    const s = (.38 + tr2() * .45) * (.8 + THREE.MathUtils.smoothstep(Math.hypot(x - center.x, z - center.z), 20, 50) * .7);
    const col = new THREE.Color(h > 6 ? '#5f7f5c' : C.plant[(tr2() * 3) | 0]).offsetHSL((tr2() - .5) * .03, 0, (tr2() - .5) * .08);
    const m = new THREE.Matrix4().compose(new THREE.Vector3(x, h - .05, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, tr2() * 6, 0)), new THREE.Vector3(s, s * (.9 + tr2() * .3), s));
    (h > 4.5 || tr2() < .3 ? conifers : broads).push([m, col]);
  }
  [[coniferG, conifers], [broadG, broads]].forEach(([g, list]) => {
    const im = new THREE.InstancedMesh(g, bgTreeMat, list.length);
    list.forEach(([m, c], i) => { im.setMatrixAt(i, m); im.setColorAt(i, c); });
    im.castShadow = false; im.receiveShadow = false;
    scene.add(im);
  });

  // ── 三圈遠山剪影 ──
  const ridges = [[96, 16, '#9fb39a', .35], [118, 24, '#a9b7b4', .55], [140, 32, '#b9c2c8', .75]].map(([rad, hgt, col, mixK], ri) => {
    const seg = 160, pos = [], idx = [];
    for (let i = 0; i <= seg; i++) {
      const a = i / seg * Math.PI * 2;
      const n = simplex.noise(Math.cos(a) * 3 + ri * 10, Math.sin(a) * 3) * .5 + .5;
      const n2 = simplex.noise(Math.cos(a) * 9 + ri * 7, Math.sin(a) * 9) * .5 + .5;
      const h = hgt * (.35 + n * .55 + n2 * .18);
      const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      pos.push(x, -3, z, x, h, z);
      if (i < seg) { const b = i * 2; idx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
    const mat = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, fog: false });
    const m = new THREE.Mesh(g, mat);
    m.position.set(center.x, 0, center.z);
    m.renderOrder = -5;
    scene.add(m);
    return { mat, base: new THREE.Color(col), k: mixK };
  });
  onTimeApplied.push(() => {
    ridges.forEach((r) => r.mat.color.copy(r.base).multiply(hemi.color).lerp(skyU.uHorizon.value, r.k));
  });

  // ── 雲 ──
  const clouds = [];
  const cloudR = mulberry32(404);
  for (let i = 0; i < 12; i++) {
    const puffs = [];
    const n = 4 + ((cloudR() * 4) | 0);
    for (let k = 0; k < n; k++) puffs.push([(k - n / 2) * 1.3 + cloudR() * .6, cloudR() * .8, (cloudR() - .5) * 1.6, 1.4 + cloudR() * 1.4]);
    clouds.push({ x: (cloudR() - .5) * 160, y: 17 + cloudR() * 12, z: (cloudR() - .5) * 120 - 20, v: .25 + cloudR() * .35, puffs });
  }
  const cloudMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, emissive: '#ffffff', emissiveIntensity: .25, fog: true }), clouds.reduce((a, c) => a + c.puffs.length, 0));
  cloudMesh.frustumCulled = false;
  scene.add(cloudMesh);
  function updateClouds(dt) {
    let i = 0;
    clouds.forEach((c) => {
      c.x += c.v * dt; if (c.x > 90) c.x = -90;
      c.puffs.forEach(([px, py, pz, s]) => cloudMesh.setMatrixAt(i++, _m.compose(_p.set(center.x + c.x + px, c.y + py, center.z + c.z + pz), _q.identity(), _s.set(s, s * .7, s))));
    });
    cloudMesh.instanceMatrix.needsUpdate = true;
  }
  updateClouds(0);
  onFrame.push((dt, animate) => {
    if (animate) updateClouds(dt);
    const far = camera.position.distanceTo(controls.target) >= 26;
    if (smallGroup.visible === far) { smallGroup.visible = !far; dirty = true; }
  });


  // ───────────────────────── 時鐘 ─────────────────────────
  const clockEl = $('#clock');
  let paused = false;
  let lastMinuteShown = -1;
  const fmt = (m) => { m = ((Math.floor(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  function setTime(m) { world.minutes = m; applyTime(m); lastMinuteShown = -1; }
  document.querySelectorAll('[data-time]').forEach((b) => b.addEventListener('click', () => setTime(+b.dataset.time)));
  const pauseBtn = $('#pauseBtn');
  pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.setAttribute('aria-pressed', paused); });

  // ───────────────────────── 選取（階段 1：只做標籤狀態） ─────────────────────────
  let selected = null;
  function onIslandLabel(s) {
    selected = selected === s ? null : s;
    islands.forEach((o) => {
      o.label.classList.toggle('sel', o === selected);
      o.label.classList.toggle('dim', !!selected && o !== selected);
    });
    dirty = true;
  }

  // ───────────────────────── 尺寸 ─────────────────────────
  function resize() {
    const w = stageEl.clientWidth || innerWidth, h = stageEl.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    labelRenderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    dirty = true;
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();
  overview();
  setTime(600);

  // ───────────────────────── 迴圈 ─────────────────────────
  controls.addEventListener('change', () => { dirty = true; });
  const clock = new THREE.Clock();
  let elapsed = 0;
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.08);
    const animate = !reduceMQ.matches;
    if (animate) {
      elapsed += dt;
      waterU.uTime.value = elapsed;
      dirty = true;
      if (!paused) {
        world.minutes = (world.minutes + dt * 10) % 1440;
        const tenth = Math.floor(world.minutes);
        if (tenth !== lastMinuteShown) { applyTime(world.minutes); }
      }
    }
    const shown = Math.floor(world.minutes);
    if (shown !== lastMinuteShown) { clockEl.textContent = fmt(shown); lastMinuteShown = shown; }
    onFrame.forEach((f) => f(dt, animate));
    controls.update();
    if (!dirty) return;
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    dirty = false;
  }
  frame();
  reduceMQ.addEventListener?.('change', () => { dirty = true; });

  requestAnimationFrame(() => $('#loading').classList.add('done'));
  window.__city = { scene, camera, controls, renderer, setTime, islands };
}

</script>
